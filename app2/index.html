<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cyprus Exam Prep</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --sand:#f5efe3;--paper:#fffaf1;--ink:#16324a;--ink2:#4c6274;--line:#e4dccb;
  --copper:#c8702a;--copper-soft:#f3dcc4;--olive:#5d7d36;--olive-soft:#e4ecd5;
  --red:#c0453b;--red-soft:#f6dcd8;--sea:#1f5b85;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding:0 18px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
.hidden{display:none!important}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

/* header */
.eyebrow{margin:22px 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--copper);font-weight:700}
h1{font-size:31px;line-height:1.1;margin:0;font-weight:700}
.meta{display:flex;align-items:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink2)}
.chip b{color:var(--ink)}

/* progress panel */
.panel{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;margin-top:18px;position:relative;overflow:hidden}
.panel::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(255,255,255,.06)}
.panel .lbl{font-size:13px;opacity:.75;letter-spacing:.3px}
.panel .num{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.panel .num b{font-size:44px;line-height:1}
.panel .num span{opacity:.75;font-size:14px}
.track{height:10px;background:rgba(255,255,255,.14);border-radius:10px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--copper);border-radius:10px;transition:width .4s}
.marks{display:flex;justify-content:space-between;font-size:11.5px;opacity:.7;margin-top:6px}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.act{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.act .i{width:42px;height:42px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.act b{display:block;font-size:14px}
.act small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.act.main{background:var(--copper);border-color:var(--copper);color:#fff}
.act.main .i{background:rgba(255,255,255,.2)}
.act.main small{color:rgba(255,255,255,.85)}

/* topics grid */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h2{font-size:22px;margin:0}
.sec span{font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:132px;position:relative}
.tile .em{font-size:26px}
.tile b{font-size:14.5px;line-height:1.25;margin-top:auto;padding-top:10px}
.tile small{color:var(--ink2);font-size:12px;margin-top:4px}
.tile .rg{position:absolute;top:12px;right:12px;width:38px;height:38px}
.tile .rg svg{transform:rotate(-90deg)}
.tile .rg span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink2)}
.tile.done{border-color:var(--olive);background:var(--olive-soft)}
.reset{display:block;margin:24px auto 0;color:var(--ink2);font-size:13px;text-decoration:underline;text-align:center}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;margin:16px 0 18px}
.qbar .x{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex-shrink:0;text-align:center}
.qbar .prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--sea);transition:width .25s}
.qbar .cnt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.timer{font-weight:700;color:var(--ink)}
.qtopic{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--copper);font-weight:700;margin-bottom:8px}
.qtext{font-size:21px;font-weight:700;line-height:1.3;margin:0 0 8px}
.qru{color:var(--ink2);font-size:15px;line-height:1.4;margin:0}
.toggle{font-size:13px;color:var(--sea);padding:8px 0 14px;text-decoration:underline}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;line-height:1.35}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;color:var(--ink2)}
.opt .t{padding-top:3px}
.opt small{display:block;color:var(--ink2);font-size:13.5px;margin-top:3px}
.opt.sel{border-color:var(--sea);box-shadow:0 0 0 3px rgba(31,91,133,.12)}
.opt.sel .l{background:var(--sea);color:#fff}
.opt.ok{border-color:var(--olive);background:var(--olive-soft)}
.opt.ok .l{background:var(--olive);color:#fff}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .l{background:var(--red);color:#fff}
.expl{border-left:4px solid var(--copper);background:var(--paper);border-radius:0 14px 14px 0;padding:12px 14px;margin:8px 0 14px;font-size:15px;line-height:1.45}
.expl b{display:block;margin-bottom:4px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:15px;font-weight:700;font-size:16.5px;text-align:center}
.btn:disabled{opacity:.35}
.foot{position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--sand) 70%,rgba(245,239,227,0))}

/* result */
.res{padding-top:28px}
.score{background:var(--ink);color:#fff;border-radius:22px;padding:22px;text-align:center}
.score .big{font-size:54px;font-weight:800;line-height:1;margin:8px 0}
.score .verdict{font-size:17px;font-weight:600}
.score p{opacity:.75;font-size:14px;margin:8px 0 0}
.review h2{font-size:20px;margin:24px 0 10px}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.4}
.rv .g{color:var(--olive);font-weight:600}.rv .r{color:var(--red)}
.rv .m{color:var(--ink2)}
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <div class="eyebrow">Κύπρος · экзамен по культуре</div>
  <h1 class="serif">Кипр: история, культура и государство</h1>
  <div class="meta">
    <span class="chip">📅 до экзамена <b id="days">–</b></span>
    <span class="chip">📚 <b id="totalQ">0</b> вопросов</span>
  </div>

  <div class="panel">
    <div class="lbl">Готовность к экзамену</div>
    <div class="num"><b id="readyPct">0%</b><span id="readyTxt"></span></div>
    <div class="track"><i id="readyBar"></i></div>
    <div class="marks"><span>0%</span><span>цель — 60%+ верных ответов</span><span>100%</span></div>
  </div>

  <div class="actions">
    <button class="act main" id="startAll"><div class="i">▶</div><b>Учить</b><small>15 вопросов</small></button>
    <button class="act" id="startExam"><div class="i" style="background:var(--copper-soft)">⏱</div><b>Экзамен</b><small>25 · 45 мин</small></button>
    <button class="act" id="startMist"><div class="i" style="background:var(--red-soft)">↻</div><b>Ошибки</b><small id="mistCount">0</small></button>
  </div>

  <div class="sec"><h2 class="serif">Темы</h2><span>выберите тему</span></div>
  <div class="grid" id="cats"></div>
  <button class="reset" id="resetBtn">Сбросить прогресс</button>
</section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="qbar">
    <button class="x" id="quit">✕</button>
    <div class="prog"><i id="qProg"></i></div>
    <span class="cnt" id="qCount"></span>
  </div>
  <div class="qtopic" id="qTitle"></div>
  <p class="qtext serif" id="qText"></p>
  <p class="qru" id="qRu"></p>
  <button class="toggle" id="trToggle"></button>
  <div id="opts"></div>
  <div class="expl hidden" id="expl"></div>
  <div class="foot"><button class="btn" id="next" disabled>Ответить</button></div>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
  <div class="res">
    <div class="score">
      <div style="font-size:36px" id="resEmoji"></div>
      <div class="big" id="resScore"></div>
      <div class="verdict" id="resVerdict"></div>
      <p id="resNote"></p>
    </div>
    <button class="btn" id="resHome" style="margin-top:14px;background:var(--copper)">На главную</button>
    <div class="review" id="review"></div>
  </div>
</section>

<script>
var BANK = {"qs": [{"id": "1.1", "ch": 1, "q": "Ποια από τις ακόλουθες πληροφορίες για την Κύπρο είναι σωστή;", "o": ["Είναι το μεγαλύτερο, σε έκταση, νησί της Μεσογείου.", "Βρίσκεται στη δυτική λεκάνη της Μεσογείου.", "Έχει μεσογειακό κλίμα με ξηρά καλοκαίρια και ήπιους χειμώνες.", "Είναι το μικρότερο, σε πληθυσμό, κράτος-μέλος της ΕΕ."], "ru": "Какое утверждение о Кипре верно?", "ro": ["Самый большой по площади остров Средиземного моря", "Находится в западной части Средиземноморья", "Средиземноморский климат с сухим летом и мягкой зимой", "Самое маленькое по населению государство ЕС"], "a": 2, "e": "Средиземноморский климат с сухим летом и мягкой зимой. Остальное ложно: Кипр — третий остров по площади (после Сицилии и Сардинии), лежит в восточном Средиземноморье, а самое маленькое по населению государство ЕС — Мальта. (Вопрос марта 2026.)"}, {"id": "1.2", "ch": 1, "q": "Η συνολική έκταση της Κύπρου είναι…", "o": ["29.289 km²", "4.251 km²", "9.251 km²", "32.251 km²"], "ru": "Общая площадь Кипра составляет…", "ro": [], "a": 2, "e": "9.251 km². Запоминалка: «3 — 9251», третий остров, 9251 км²."}, {"id": "1.3", "ch": 1, "q": "Οι επίσημες γλώσσες της Κυπριακής Δημοκρατίας σύμφωνα με το Σύνταγμα είναι…", "o": ["η ελληνική και η αγγλική", "η ελληνική και η τουρκική", "η ελληνική", "η ελληνική, η αγγλική και η τουρκική"], "ru": "Официальные языки Республики Кипр по Конституции:", "ro": ["греческий и английский", "греческий и турецкий", "греческий", "греческий, английский и турецкий"], "a": 1, "e": "Греческий и турецкий. Английский широко распространён, но официальным не является."}, {"id": "1.4", "ch": 1, "q": "Τι δεν ισχύει για τη σημαία της Κυπριακής Δημοκρατίας;", "o": ["Περιλαμβάνει ένα μπλε σταυρό.", "Το φόντο της σημαίας είναι λευκό.", "Περιλαμβάνει δύο κλαδιά ελιάς.", "Απεικονίζει τον χάρτη της Κύπρου."], "ru": "Что НЕ верно о флаге Кипра?", "ro": ["На нём синий крест", "Фон белый", "Две оливковые ветви", "Изображена карта Кипра"], "a": 0, "e": "Синего креста нет: он на флаге Греции. На флаге Кипра — белый фон, медно-жёлтая карта и две зелёные оливковые ветви."}, {"id": "1.5", "ch": 1, "q": "Ποια χώρα βρίσκεται πιο κοντά στην Κύπρο;", "o": ["Η Ελλάδα", "Η Αίγυπτος", "Η Τουρκία", "Το Ισραήλ"], "ru": "Какая страна ближе всего к Кипру?", "ro": [], "a": 2, "e": "Турция, 75 км. До Сирии 105 км, до Израиля 200 км, до Египта 380 км, до Греции ≈800 км."}, {"id": "1.6", "ch": 1, "q": "Πού βρίσκεται η Κύπρος σε σχέση με την Τουρκία;", "o": ["Βόρεια", "Νότια", "Δυτικά", "Ανατολικά"], "ru": "Где находится Кипр относительно Турции?", "ro": ["К северу", "К югу", "К западу", "К востоку"], "a": 1, "e": "Кипр лежит к югу от Турции (νότια)."}, {"id": "1.7", "ch": 1, "q": "Ποια είναι η μέση ετήσια θερμοκρασία στη Λευκωσία;", "o": ["15,5 °C", "19,5 °C", "22,5 °C", "25,5 °C"], "ru": "Средняя годовая температура в Никосии?", "ro": [], "a": 1, "e": "19,5 °C. Проверено тестом; ловушки — 15,5 / 22,5 / 25,5."}, {"id": "1.8", "ch": 1, "q": "Σε ποια περιοχή της Κύπρου σημειώνεται η μεγαλύτερη βροχόπτωση;", "o": ["Στην Πάφο", "Στη Λάρνακα", "Στην οροσειρά του Τροόδους", "Στη Λευκωσία"], "ru": "Где на Кипре выпадает больше всего осадков?", "ro": [], "a": 2, "e": "Горы Троодоса: высота даёт дожди и снег."}, {"id": "1.9", "ch": 1, "q": "Ποια είναι η πιο διαδεδομένη ξένη γλώσσα στην Κύπρο;", "o": ["Η ρωσική", "Η αγγλική", "Η γαλλική", "Η γερμανική"], "ru": "Самый распространённый иностранный язык на Кипре?", "ro": [], "a": 1, "e": "Английский — наследие британского правления 1878–1960."}, {"id": "1.10", "ch": 1, "q": "Όταν στο Λονδίνο η ώρα είναι 12:00, στην Κύπρο είναι…", "o": ["11:00", "13:00", "14:00", "15:00"], "ru": "Когда в Лондоне 12:00, на Кипре…", "ro": [], "a": 2, "e": "Кипр на 2 часа впереди Лондона круглый год: оба переводят часы в одни и те же даты."}, {"id": "1.11", "ch": 1, "q": "Σε ποιον από τους ακόλουθους οργανισμούς ΔΕΝ ανήκει η Κύπρος;", "o": ["ΟΗΕ", "Ευρωπαϊκή Ένωση", "ΝΑΤΟ", "Κοινοπολιτεία"], "ru": "В какую из организаций Кипр НЕ входит?", "ro": ["ООН", "ЕС", "НАТО", "Содружество"], "a": 2, "e": "НАТО. В ООН Кипр с 1960, в Содружестве с 1961, в ЕС с 2004."}, {"id": "1.12", "ch": 1, "q": "Οι διοικητικές επαρχίες της Κύπρου είναι…", "o": ["5", "4", "6", "7"], "ru": "Сколько административных районов на Кипре?", "ro": [], "a": 2, "e": "6 районов: Λευκωσία, Λεμεσός, Λάρνακα, Πάφος, Αμμόχωστος, Κερύνεια."}, {"id": "1.13", "ch": 1, "q": "Ποια επαρχία βρίσκεται εξ ολοκλήρου στα κατεχόμενα;", "o": ["Αμμόχωστος", "Κερύνεια", "Λευκωσία", "Λάρνακα"], "ru": "Какой район полностью оккупирован?", "ro": [], "a": 1, "e": "Кирения оккупирована полностью. Фамагуста — большей частью, Никосия и Ларнака — частично."}, {"id": "1.14", "ch": 1, "q": "Το λευκό χρώμα στη σημαία της Κύπρου συμβολίζει…", "o": ["τη θάλασσα", "την ειρήνη", "τον χαλκό", "την ορθοδοξία"], "ru": "Белый цвет на флаге Кипра символизирует…", "ro": ["море", "мир", "медь", "православие"], "a": 1, "e": "Мир (η ειρήνη). Медь символизирует жёлто-медный цвет карты."}, {"id": "1.15", "ch": 1, "q": "Σωστό ή Λάθος: «Περίπου το 5% του πληθυσμού της Κύπρου είναι αλλοδαποί.»", "o": ["Σωστό", "Λάθος"], "ru": "Верно или неверно: «Около 5% населения Кипра — иностранцы».", "ro": [], "a": 1, "e": "(Λάθος). Иностранцев около 20%. (Вопрос июля 2023.) Ответы к главе 2"}, {"id": "2.1", "ch": 2, "q": "Η πιο ψηλή κορυφή της οροσειράς του Τροόδους είναι…", "o": ["Όλυμπος (Χιονίστρα)", "Άγιος Ιλαρίωνας", "Κύκκος", "Κυπαρισσόβουνο"], "ru": "Самая высокая вершина Троодоса:", "ro": ["Олимп (Хионистра)", "Святой Иларион", "Киккос", "Кипарисовуно"], "a": 0, "e": "Олимп (Хионистра), 1952 м. Святой Иларион и Кипарисовуно — в Пентадактилосе. Киккос — монастырь, а не вершина."}, {"id": "2.2", "ch": 2, "q": "Ποια από τις πιο κάτω βουνοκορφές δεν βρίσκεται στην οροσειρά του Πενταδάκτυλου;", "o": ["Παπούτσα", "Καντάρα", "Κυπαρισσόβουνο", "Άγιος Ιλαρίωνας"], "ru": "Какая вершина НЕ находится в хребте Пентадактилос?", "ro": [], "a": 0, "e": "Папуца стоит в Троодосе («тапочки — дома, в центре»). Кантара, Кипарисовуно и Святой Иларион — вершины Пентадактилоса. (Июль 2026 II.)"}, {"id": "2.3", "ch": 2, "q": "Τα χωριά Κακοπετριά και Γαλάτα βρίσκονται στη γεωγραφική περιοχή της…", "o": ["Μαραθάσας", "Σολέας", "Πιτσιλιάς", "Τηλλυρίας"], "ru": "Деревни Какопетрия и Галата находятся в области…", "ro": [], "a": 1, "e": "Солеа («соль и молоко» — Какопетрия и Галата). Марафаса — это Педулас и Калопанайотис. (Июль 2026 I.)"}, {"id": "2.4", "ch": 2, "q": "Σε ποιον κόλπο εκβάλλουν οι ποταμοί Πεδιαίος και Γιαλιάς;", "o": ["Επισκοπής", "Μόρφου", "Λάρνακας", "Αμμοχώστου"], "ru": "В какой залив впадают реки Педиэос и Ялиас?", "ro": [], "a": 3, "e": "В залив Фамагусты: обе реки текут через Месаорию на восток. (Июль 2026 II.)"}, {"id": "2.5", "ch": 2, "q": "Το μεγαλύτερο, σε χωρητικότητα, φράγμα νερού στην Κύπρο είναι…", "o": ["του Ασπρόκρεμμου", "της Ευρέτου", "του Κούρη", "της Γερμασόγειας"], "ru": "Крупнейшая по ёмкости плотина Кипра?", "ro": [], "a": 2, "e": "Курис, 115 млн м³. Второе место — Аспрокреммос (52), третье — Эвретоу (24). (Июль 2026 II.)"}, {"id": "2.6", "ch": 2, "q": "Ποιο είναι το μακρύτερο ποτάμι της Κύπρου;", "o": ["Κούρης", "Πεδιαίος", "Διάριζος", "Ξερός"], "ru": "Самая длинная река Кипра?", "ro": [], "a": 1, "e": "Педиэос, около 98 км. Курис здесь ловушка: это самое большое водохранилище, но не самая длинная река."}, {"id": "2.7", "ch": 2, "q": "Ποια από τις πιο κάτω περιοχές δεν ανήκει στο Δίκτυο Natura 2000;", "o": ["Η αλυκή της Λάρνακας", "Η μαρίνα της Λεμεσού", "Η χερσόνησος του Ακάμα", "Το δάσος της Πάφου"], "ru": "Что НЕ входит в сеть Natura 2000?", "ro": ["Солёное озеро Ларнаки", "марина Лимасола", "полуостров Акамас", "Пафосский лес"], "a": 1, "e": "Марина Лимасола — искусственный порт, в Natura 2000 она не входит. (Июль 2026 I.)"}, {"id": "2.8", "ch": 2, "q": "Ποιος από τους ακόλουθους βιότοπους βρίσκεται στην επαρχία Λευκωσίας;", "o": ["Δασικό Πάρκο Κάβο Γκρέκο", "Λίμνη Ορόκλινης", "Εκδρομικός χώρος Πλατάνια", "Παραλία Λάρας-Τοξεύτρας"], "ru": "Какой природный объект находится в районе Никосии?", "ro": [], "a": 2, "e": "Платанья («платаны у столицы»). Каво Греко относится к Фамагусте, озеро Ороклини — к Ларнаке, пляж Лара — к Пафосу. (Июль 2026 I.)"}, {"id": "2.9", "ch": 2, "q": "Το Φαράγγι του Άβακα βρίσκεται στην επαρχία…", "o": ["Λάρνακας", "Ελεύθερης Αμμοχώστου", "Πάφου", "Λεμεσού"], "ru": "Ущелье Авакас находится в районе…", "ro": [], "a": 2, "e": "Пафос (полуостров Акамас). (Июль 2026 I.)"}, {"id": "2.10", "ch": 2, "q": "Σε ποια επαρχία βρίσκεται το δασικό πάρκο Κάβο Γκρέκο;", "o": ["Αμμοχώστου", "Λεμεσού", "Λάρνακας", "Πάφου"], "ru": "В каком районе лесной парк Каво Греко?", "ro": [], "a": 0, "e": "Фамагуста (свободная часть), рядом Протарас и Айя-Напа. (Март 2026.)"}, {"id": "2.11", "ch": 2, "q": "Ο βιότοπος όπου συναντάται το κυπριακό αγρινό είναι…", "o": ["η Καρπασία", "η Αλυκή Λάρνακας", "το δάσος Πάφου", "ο Ακάμας"], "ru": "Где обитает кипрский муфлон?", "ro": [], "a": 2, "e": "Пафосский лес. (Март 2026.)"}, {"id": "2.12", "ch": 2, "q": "Ποιο από τα πιο κάτω χωριά είναι παραθαλάσσιο;", "o": ["Αγρός", "Δρούσεια", "Περβόλια", "Φοινί"], "ru": "Какая деревня прибрежная?", "ro": [], "a": 2, "e": "Перволия (Ларнака). Агрос, Друсия и Фини — горные или холмовые деревни. (Июль 2026 I.)"}, {"id": "2.13", "ch": 2, "q": "Ποιος από τους πιο κάτω Δήμους βρίσκεται στα κατεχόμενα;", "o": ["Αγίου Αθανασίου", "Αθηαίνου", "Ακανθούς", "Αραδίππου"], "ru": "Какой муниципалитет на оккупированной территории?", "ro": [], "a": 2, "e": "Акантý — оккупированный муниципалитет (административно — район Фамагусты). Агиос Афанасиос относится к Лимасолу, Атиену и Арадиппу — к Ларнаке. (Июль 2026 I.)"}, {"id": "2.14", "ch": 2, "q": "Το μονοπάτι της φύσης «Καληδόνια» βρίσκεται…", "o": ["στο δάσος του Τροόδους", "στο δάσος του Ακάμα", "στον Πενταδάκτυλο", "στο Εθνικό Δασικό Πάρκο Κάβο Γκρέκο"], "ru": "Где природная тропа «Каледония»?", "ro": [], "a": 0, "e": "Лес Троодоса, у Платреса. (Июль 2026 II.)"}, {"id": "2.15", "ch": 2, "q": "Η Γαλάζια Σημαία στην Κύπρο…", "o": ["δηλώνει ένα δάσος με μονοπάτια της φύσης", "βρίσκεται έξω από αρχαιολογικούς χώρους", "είναι σήμα πιστοποίησης μιας καθαρής παραλίας", "βρίσκεται στους χάρτες των δρόμων του κρασιού"], "ru": "«Голубой флаг» на Кипре:", "ro": ["обозначает лес с тропами", "стоит у археологических памятников", "знак сертификации чистого пляжа", "есть на картах винных маршрутов"], "a": 2, "e": "Голубой флаг — знак сертификации чистого пляжа. (Июль 2026 I.)"}, {"id": "2.16", "ch": 2, "q": "Σε ποια επαρχία βρίσκεται η Πέγεια;", "o": ["Λεμεσού", "Πάφου", "Λάρνακας", "Αμμοχώστου"], "ru": "В каком районе Пейя?", "ro": [], "a": 1, "e": "Пафос."}, {"id": "2.17", "ch": 2, "q": "Σε ποιες επαρχίες βρίσκονται οι αλυκές της Κύπρου;", "o": ["Λευκωσίας και Πάφου", "Λάρνακας και Λεμεσού", "Αμμοχώστου και Κερύνειας", "Πάφου και Λεμεσού"], "ru": "В каких районах солёные озёра?", "ro": [], "a": 1, "e": "Ларнака и Лимасол (Акротири)."}, {"id": "2.18", "ch": 2, "q": "Ποιο ποσοστό του εδάφους της Κύπρου κατέχει ο τουρκικός στρατός;", "o": ["26,2%", "36,2%", "46,2%", "3,6%"], "ru": "Какой процент территории Кипра оккупирован турецкой армией?", "ro": [], "a": 1, "e": "36,2%. Вариант 3,6% — ловушка: это проходной порог на выборах в парламент."}, {"id": "2.19", "ch": 2, "q": "Το Μπουφαβέντο είναι…", "o": ["καταρράκτης", "κάστρο", "φράγμα", "μοναστήρι"], "ru": "Буффавенто — это:", "ro": ["водопад", "замок", "плотина", "монастырь"], "a": 1, "e": "Замок на хребте Пентадактилос."}, {"id": "2.20", "ch": 2, "q": "Η Κυπερούντα βρίσκεται στην επαρχία…", "o": ["Λευκωσίας", "Λεμεσού", "Πάφου", "Λάρνακας"], "ru": "В каком районе Киперунда?", "ro": [], "a": 1, "e": "Лимасол (область Пицилья). Ответы к главе 5"}, {"id": "3.1", "ch": 3, "q": "Σε ποια επαρχία βρίσκεται το χωριό Κακοπετριά;", "o": ["Λεμεσός", "Λευκωσία", "Πάφος", "Λάρνακα"], "ru": "В каком районе находится Какопетрия?", "ro": [], "a": 1, "e": "Солеа, северный склон, правило 1."}, {"id": "3.2", "ch": 3, "q": "Σε ποιο χωριό γιορτάζεται το Φεστιβάλ Λεβάντας;", "o": ["Πλάτρες", "Μηλιού", "Φικάρδου", "Λιμνάτης"], "ru": "Где проходит фестиваль лаванды?", "ro": [], "a": 0, "e": "Платрес."}, {"id": "3.3", "ch": 3, "q": "Σε ποια επαρχία βρίσκεται το χωριό Ξυλοφάγου;", "o": ["Αμμόχωστος", "Λάρνακα", "Λευκωσία", "Λεμεσός"], "ru": "В каком районе находится Ксилофагу?", "ro": [], "a": 1, "e": "исключение из правила 6."}, {"id": "3.4", "ch": 3, "q": "Σε ποιο χωριό γιορτάζεται το Φεστιβάλ Πορτοκαλιού;", "o": ["Αυγόρου", "Όμοδος", "Μηλιού", "Παλώδια"], "ru": "Где проходит фестиваль апельсина?", "ro": [], "a": 2, "e": "Милиу."}, {"id": "3.5", "ch": 3, "q": "Σε ποια επαρχία ανήκει η Μονή Κύκκου;", "o": ["Πάφος", "Λεμεσός", "Λευκωσία", "Κερύνεια"], "ru": "К какому району относится монастырь Киккос?", "ro": [], "a": 2, "e": "Марафаса."}, {"id": "5.1", "ch": 5, "q": "Ποιος από τους ακόλουθους αρχαιολογικούς χώρους συμπεριλαμβάνεται στον κατάλογο Πολιτιστικής Κληρονομιάς της ΟΥΝΕΣΚΟ;", "o": ["Η αρχαία πόλη της Σαλαμίνας", "Το Αββαείο του Μπέλαπαϊς", "Ο Νεολιθικός Οικισμός της Χοιροκοιτίας", "Το αρχαίο Κούριον"], "ru": "Какой памятник в списке ЮНЕСКО?", "ro": [], "a": 2, "e": "Хирокития (ЮНЕСКО, 1998). Саламин и Беллапаис находятся на оккупированном севере и в списке ЮНЕСКО нет. Курион в список тоже не входит. (Июль 2026 II.)"}, {"id": "5.2", "ch": 5, "q": "Σύμφωνα με τη μυθολογία η θεά Αφροδίτη…", "o": ["γεννήθηκε στα Λουτρά της Αφροδίτης", "εμφανίστηκε για πρώτη φορά στο μονοπάτι του Άδωνη", "αναδύθηκε από τον αφρό της θάλασσας στην Πέτρα του Ρωμιού", "βρέθηκε μέσα σε ένα κοχύλι στο Φαράγγι του Άβακα"], "ru": "Согласно мифологии, Афродита:", "ro": ["родилась в Купальнях Афродиты", "впервые появилась на тропе Адониса", "вышла из морской пены у Петра-ту-Ромиу", "была найдена в раковине в ущелье Авакас"], "a": 2, "e": "Афродита вышла из морской пены у Петра-ту-Ромиу («Афро-пена»: αφρός значит «пена»). В Купальнях Афродиты она, по мифу, купалась, а не родилась. (Июль 2026 I.)"}, {"id": "5.3", "ch": 5, "q": "Στα αρχαία χρόνια η Κύπρος ήταν σημαντικό κέντρο λατρείας της θεάς…", "o": ["Δήμητρας", "Αθηνάς", "Αφροδίτης", "Άρτεμης"], "ru": "В древности Кипр был центром культа богини…", "ro": [], "a": 2, "e": "Афродита. Главное святилище было в Палеопафосе (Куклия). (Март 2026.)"}, {"id": "5.4", "ch": 5, "q": "Ποιος από τους πιο κάτω αρχαιολογικούς χώρους βρίσκεται στις κατεχόμενες περιοχές;", "o": ["Χοιροκοιτία", "Κούριον", "Αμαθούς", "Σαλαμίνα"], "ru": "Какой памятник на оккупированной территории?", "ro": [], "a": 3, "e": "Саламин («салями — северная колбаса»). (Июль 2025.)"}, {"id": "5.5", "ch": 5, "q": "Ποιος είναι ο αρχαιότερος γνωστός οικισμός της Κύπρου;", "o": ["Σόλοι", "Μάα-Παλαιόκαστρο", "Χοιροκοιτία", "Ταμασσός"], "ru": "Древнейшее известное поселение Кипра?", "ro": [], "a": 2, "e": "Хирокития, неолит (≈7000 лет до н. э.; ключ теста — известны и более ранние поселения, например Климонас)."}, {"id": "5.6", "ch": 5, "q": "Ποια πόλη ήταν πρωτεύουσα της Κύπρου κατά τη ρωμαϊκή περίοδο;", "o": ["Σαλαμίνα", "Κούριον", "Πάφος", "Κίτιον"], "ru": "Столица Кипра в римский период?", "ro": [], "a": 2, "e": "Пафос. Ловушка — Курион: там знаменитый театр, но столицей он не был."}, {"id": "5.7", "ch": 5, "q": "Ο φιλόσοφος Ζήνων, ιδρυτής της Στωικής φιλοσοφίας, καταγόταν από…", "o": ["τη Σαλαμίνα", "το Κίτιον (Λάρνακα)", "την Πάφο", "την Αμαθούντα"], "ru": "Философ Зенон, основатель стоицизма, был родом из…", "ro": [], "a": 1, "e": "Китион, то есть современная Ларнака."}, {"id": "5.8", "ch": 5, "q": "Σε ποιο κάστρο παντρεύτηκε ο Ριχάρδος ο Λεοντόκαρδος τη Βερεγγάρια;", "o": ["Κολοσσίου", "Λεμεσού", "Κερύνειας", "Πάφου"], "ru": "В каком замке Ричард Львиное Сердце женился на Беренгарии?", "ro": [], "a": 1, "e": "В замке Лимасола, 1191 год. Беренгарию там же короновали королевой Англии."}, {"id": "5.9", "ch": 5, "q": "Πόσα χρόνια διήρκεσε η Τουρκοκρατία στην Κύπρο;", "o": ["82", "207", "307", "400"], "ru": "Сколько лет длилось османское правление?", "ro": [], "a": 2, "e": "307 лет (1571–1878). 82 года — это срок британского правления."}, {"id": "5.10", "ch": 5, "q": "Από ποιο έτος η Κύπρος βρέθηκε υπό βρετανική διοίκηση;", "o": ["1571", "1878", "1914", "1925"], "ru": "С какого года Кипр под британским управлением?", "ro": [], "a": 1, "e": "1878 год. 1914 — аннексия, 1925 — статус коронной колонии."}, {"id": "5.11", "ch": 5, "q": "Με ποιο έργο του Σαίξπηρ συνδέεται η Αμμόχωστος;", "o": ["Άμλετ", "Ρωμαίος και Ιουλιέτα", "Οθέλλος", "Μάκβεθ"], "ru": "С какой пьесой Шекспира связана Фамагуста?", "ro": [], "a": 2, "e": "«Отелло»: «Башня Отелло» стоит в цитадели Фамагусты."}, {"id": "5.12", "ch": 5, "q": "Ποια είναι η μεγαλύτερη πύλη των ενετικών τειχών της Λευκωσίας;", "o": ["Πύλη Πάφου", "Πύλη Κερύνειας", "Πύλη Αμμοχώστου", "Πύλη Λεμεσού"], "ru": "Самые большие ворота венецианских стен Никосии?", "ro": [], "a": 2, "e": "Фамагустские ворота (Πύλη Αμμοχώστου)."}, {"id": "5.13", "ch": 5, "q": "Ποια από τα ακόλουθα ΔΕΝ ισχύει για το αρχαίο Κούριον;", "o": ["Ήταν η πρωτεύουσα της Κύπρου", "Το θέατρό του χωρούσε πάνω από 3.000 θεατές", "Ιδρύθηκε από Μυκηναίους", "Κοντά βρίσκεται το ιερό του Απόλλωνα Υλάτη"], "ru": "Что НЕ верно о Курионе?", "ro": ["Был столицей Кипра", "театр вмещал более 3000 зрителей", "основан микенцами", "рядом святилище Аполлона Хилатского"], "a": 0, "e": "Курион не был столицей. Остальные три утверждения верны."}, {"id": "5.14", "ch": 5, "q": "Ο ιδρυτής της Εκκλησίας της Κύπρου είναι ο…", "o": ["Απόστολος Παύλος", "Απόστολος Βαρνάβας", "Άγιος Λάζαρος", "Απόστολος Ανδρέας"], "ru": "Основатель Церкви Кипра — …", "ro": [], "a": 1, "e": "Апостол Варнава, уроженец Саламина. Павел проповедовал вместе с ним, но основателем Церкви считается Варнава."}, {"id": "5.15", "ch": 5, "q": "Πώς ονομαζόταν η Λευκωσία στην αρχαιότητα;", "o": ["Κίτιον", "Λήδρα", "Ιδάλιον", "Μάριον"], "ru": "Как называлась Никосия в древности?", "ro": [], "a": 1, "e": "Ледра (Λήδρα). Отсюда улица Ледра и КПП Λήδρας. Ответы к главе 6"}, {"id": "6.1", "ch": 6, "q": "Τι σημαίνει το ακρωνύμιο ΕΟΚΑ;", "o": ["Ελληνική Οργάνωση Ανεξαρτησίας Κύπρου", "Εθνική Οργάνωσις Κυπρίων Αγωνιστών", "Ένωση Ορθόδοξων Κυπρίων Αδελφών", "Εθνική Οδός Κυπριακής Απελευθέρωσης"], "ru": "Что означает ЭОКА?", "ro": [], "a": 1, "e": "Εθνική Οργάνωσις Κυπρίων Αγωνιστών. Обратите внимание на старинное окончание «Οργάνωσις»."}, {"id": "6.2", "ch": 6, "q": "Η Κύπρος ανακηρύχθηκε ανεξάρτητη Δημοκρατία το 1960 με βάση τις συμφωνίες…", "o": ["Βιέννης–Λονδίνου", "Λονδίνου–Λευκωσίας", "Ζυρίχης–Λονδίνου", "Ζυρίχης–Άγκυρας"], "ru": "Кипр стал независимым в 1960 году на основе соглашений…", "ro": [], "a": 2, "e": "Соглашения Цюриха и Лондона, 1959 год. (Июль 2025.)"}, {"id": "6.3", "ch": 6, "q": "Ποιες τρεις χώρες έγιναν εγγυήτριες δυνάμεις της ανεξαρτησίας της Κύπρου;", "o": ["Ελλάδα, Τουρκία, ΗΠΑ", "Ελλάδα, Τουρκία, Ηνωμένο Βασίλειο", "Ελλάδα, Ηνωμένο Βασίλειο, Γαλλία", "Τουρκία, Ηνωμένο Βασίλειο, ΟΗΕ"], "ru": "Какие три страны стали гарантами независимости?", "ro": [], "a": 1, "e": "Греция, Турция и Великобритания. США и ООН гарантами не были."}, {"id": "6.4", "ch": 6, "q": "Ποια από τις ακόλουθες δηλώσεις δεν ισχύει;", "o": ["Η εγκαθίδρυση της Κυπριακής Δημοκρατίας έγινε το 1960.", "Πρώτος Πρόεδρος της Κυπριακής Δημοκρατίας ήταν ο Γλαύκος Κληρίδης.", "Το πραξικόπημα εναντίον του Προέδρου Μακαρίου έγινε στις 15 Ιουλίου 1974.", "Το σχέδιο ΑΝΑΝ απορρίφθηκε από την πλειοψηφία των Ελληνοκυπρίων."], "ru": "Какое утверждение НЕ верно?", "ro": ["Республика основана в 1960", "первым президентом был Глафкос Клиридис", "переворот против Макариоса 15 июля 1974", "план Аннана отвергнут большинством греков-киприотов"], "a": 1, "e": "Первым президентом был Макариос III. Клиридис правил с 1993 по 2003 год. Остальные три утверждения верны. (Июль 2026 I.)"}, {"id": "6.5", "ch": 6, "q": "Πότε έγιναν οι πρώτες προεδρικές εκλογές στην Κύπρο;", "o": ["Αύγουστος 1960", "Δεκέμβριος 1959", "Απρίλιος 1955", "Οκτώβριος 1960"], "ru": "Когда прошли первые президентские выборы?", "ro": [], "a": 1, "e": "13 декабря 1959 года. Макариос набрал 66,8%, Иоаннис Клиридис — 33,2%."}, {"id": "6.6", "ch": 6, "q": "Ποιο ήταν το πραγματικό όνομα του Αρχιεπισκόπου Μακαρίου Γ΄;", "o": ["Γεώργιος Γρίβας", "Μιχαήλ Χριστοδούλου Μούσκος", "Σπύρος Κυπριανού", "Γλαύκος Κληρίδης"], "ru": "Настоящее имя архиепископа Макариоса III?", "ro": [], "a": 1, "e": "Μιχαήλ Χριστοδούλου Μούσκος. Гривас — военный лидер ЭОКА, Киприану — второй президент, Клиридис — четвёртый."}, {"id": "6.7", "ch": 6, "q": "Γιατί η «Πράσινη Γραμμή» ονομάστηκε έτσι;", "o": ["Λόγω των πράσινων μπερέδων του ΟΗΕ", "Επειδή χαράχτηκε με πράσινο μολύβι σε χάρτη", "Λόγω της βλάστησης στη νεκρή ζώνη", "Λόγω του χρώματος της σημαίας"], "ru": "Почему «Зелёная линия» так называется?", "ro": ["Из-за зелёных беретов ООН", "её провели зелёным карандашом на карте", "из-за растительности в буферной зоне", "из-за цвета флага"], "a": 1, "e": "Её начертили зелёным карандашом на карте в 1963 году. Это сделал британский генерал Питер Янг."}, {"id": "6.8", "ch": 6, "q": "Πότε έγινε το πραξικόπημα κατά του Προέδρου Μακαρίου;", "o": ["20 Ιουλίου 1974", "15 Ιουλίου 1974", "14 Αυγούστου 1974", "1 Απριλίου 1955"], "ru": "Когда произошёл переворот против Макариоса?", "ro": [], "a": 1, "e": "15 июля 1974 года. 20 июля — это уже вторжение («15 — путч, 20 — турки»)."}, {"id": "6.9", "ch": 6, "q": "Πότε κηρύχθηκε η κατάπαυση του πυρός το 1974;", "o": ["15 Αυγούστου 1974", "16 Αυγούστου 1974", "16 Αυγούστου 1964", "25 Ιουλίου 1974"], "ru": "Когда было объявлено прекращение огня в 1974 году?", "ro": [], "a": 1, "e": "16 августа 1974 года."}, {"id": "6.10", "ch": 6, "q": "Οι Ελληνοκύπριοι που εκτοπίστηκαν από τις βόρειες περιοχές το 1974 ήταν περίπου…", "o": ["320.000", "50.000", "100.000", "200.000"], "ru": "Сколько греков-киприотов были вытеснены с севера в 1974 году?", "ro": [], "a": 3, "e": "Около 200 000 человек, это треть населения (ключ экзамена; официальные источники чаще дают ≈162 000). (Июль 2025.)"}, {"id": "6.11", "ch": 6, "q": "Δίνονται τα γεγονότα: α. Κατάληψη της Μόρφου από τον τουρκικό στρατό· β. Ανακήρυξη του τουρκοκυπριακού ψευδοκράτους· γ. Κατάληψη της Κερύνειας· δ. Δημοψήφισμα για το σχέδιο ΑΝΑΝ. Ποια είναι η σωστή χρονολογική σειρά (από το παλαιότερο);", "o": ["α–γ–β–δ", "β–δ–α–γ", "γ–α–β–δ", "γ–α–δ–β"], "ru": "События:", "ro": ["захват Морфу", "провозглашение псевдогосударства", "захват Кирении", "референдум по плану Аннана. Правильный хронологический порядок?"], "a": 2, "e": "Кирения (20.07.1974) → Морфу (август 1974) → «ТРСК» (1983) → референдум по плану Аннана (2004). (Июль 2026 II.)"}, {"id": "6.12", "ch": 6, "q": "Τι γιορτάζεται στην Κύπρο την 1η Απριλίου;", "o": ["Η ανεξαρτησία", "Η έναρξη του απελευθερωτικού αγώνα της ΕΟΚΑ", "Η ένταξη στην ΕΕ", "Η επανάσταση του 1821"], "ru": "Что празднуют 1 апреля?", "ro": [], "a": 1, "e": "Начало освободительной борьбы ЭОКА 1 апреля 1955 года. 25 марта отмечают греческую революцию 1821 года."}, {"id": "6.13", "ch": 6, "q": "Ποιος ήταν ο στρατιωτικός αρχηγός της ΕΟΚΑ;", "o": ["Γρηγόρης Αυξεντίου", "Γεώργιος Γρίβας (Διγενής)", "Νίκος Σαμψών", "Μακάριος Γ΄"], "ru": "Кто был военным лидером ЭОКА?", "ro": [], "a": 1, "e": "Γεώργιος Γρίβας, псевдоним Дигенис. Афксентиу был его заместителем, Макариос — политическим лидером."}, {"id": "6.14", "ch": 6, "q": "Ποιος από τους παρακάτω ΔΕΝ ήταν συνταγματικός Πρόεδρος της Κυπριακής Δημοκρατίας;", "o": ["Σπύρος Κυπριανού", "Νίκος Σαμψών", "Τάσσος Παπαδόπουλος", "Γιώργος Βασιλείου"], "ru": "Кто НЕ был конституционным президентом Кипра?", "ro": [], "a": 1, "e": "Никос Сампсон, «президент» переворота на 8 дней. Конституционным президентом он не считается."}, {"id": "6.15", "ch": 6, "q": "Επί προεδρίας ποιου η Κύπρος υιοθέτησε το ευρώ;", "o": ["Γλαύκου Κληρίδη", "Τάσσου Παπαδόπουλου", "Δημήτρη Χριστόφια", "Νίκου Αναστασιάδη"], "ru": "При каком президенте Кипр перешёл на евро?", "ro": [], "a": 1, "e": "Тассос Пападопулос, евро с 1 января 2008 года."}, {"id": "6.16", "ch": 6, "q": "Πόσα χρόνια ανεξαρτησίας συμπληρώνει η Κύπρος το 2026;", "o": ["56", "62", "66", "70"], "ru": "Сколько лет независимости исполняется Кипру в 2026 году?", "ro": [], "a": 2, "e": "66 лет (2026 − 1960). Ответы к главе 7"}, {"id": "7.1", "ch": 7, "q": "Πώς αποδίδεται ολογράφως το ακρωνύμιο ΔΔΟ, που συζητείται ως μορφή λύσης του κυπριακού προβλήματος;", "o": ["Διζωνική Δημοκρατική Ομοσπονδία", "Διακρατική Δικοινοτική Ομοσπονδία", "Διζωνική Δικοινοτική Ομοσπονδία", "Διαπραγματεύσιμη Διζωνική Ομοσπονδία"], "ru": "Как полностью расшифровывается ΔΔΟ?", "ro": [], "a": 2, "e": "Διζωνική Δικοινοτική Ομοσπονδία. Запомнить помогает «ди-зона, ди-община»: слов «демократия» и «межгосударственная» в формуле нет. (Июль 2026 I.)"}, {"id": "7.2", "ch": 7, "q": "Η προσωπική απεσταλμένη του Γενικού Γραμματέα του ΟΗΕ για το Κυπριακό είναι η…", "o": ["Μαρία Άνχελ Ολγκίν Γουεγιάρ", "Ρομπέρτα Μετσόλα", "Ούρσουλα φον ντερ Λάιεν", "Κάγια Κάλλας"], "ru": "Личный посланник Генсека ООН по Кипру — …", "ro": [], "a": 0, "e": "Мария Анхела Ольгин (Колумбия). Мецола возглавляет Европарламент, фон дер Ляйен — Еврокомиссию, Каллас отвечает за внешнюю политику ЕС. (Июль 2025.)"}, {"id": "7.3", "ch": 7, "q": "Ο σημερινός ηγέτης της τουρκοκυπριακής κοινότητας είναι ο…", "o": ["Μεχμέτ Αλί Ταλάτ", "Τουφάν Ερχιουρμάν", "Ντερβίς Έρογλου", "Μουσταφά Ακιντζί"], "ru": "Нынешний лидер турко-кипрской общины — …", "ro": [], "a": 1, "e": "Туфан Эрхюрман, лидер с октября 2025 года. Остальные в вариантах — бывшие лидеры. (Март 2026.)"}, {"id": "7.4", "ch": 7, "q": "Ποια χώρα αναγνωρίζει το τουρκοκυπριακό ψευδοκράτος;", "o": ["Καμία", "Μόνο η Τουρκία", "Η Τουρκία και το Αζερμπαϊτζάν", "Η Τουρκία και η Ρωσία"], "ru": "Какая страна признаёт турко-кипрское псевдогосударство?", "ro": [], "a": 1, "e": "Только Турция."}, {"id": "7.5", "ch": 7, "q": "Πότε ανακηρύχθηκε το τουρκοκυπριακό ψευδοκράτος;", "o": ["1974", "1983", "2003", "2004"], "ru": "Когда было провозглашено псевдогосударство?", "ro": [], "a": 1, "e": "1983 год, 15 ноября."}, {"id": "7.6", "ch": 7, "q": "Υπό την αιγίδα ποιου οργανισμού διεξάγονται οι συνομιλίες για το Κυπριακό;", "o": ["Ευρωπαϊκής Ένωσης", "ΝΑΤΟ", "ΟΗΕ", "ΟΑΣΕ"], "ru": "Под эгидой какой организации идут переговоры по Кипру?", "ro": [], "a": 2, "e": "ООН."}, {"id": "7.7", "ch": 7, "q": "Το σχέδιο ΑΝΑΝ τέθηκε σε δημοψήφισμα το…", "o": ["2002", "2004", "2008", "2017"], "ru": "План Аннана был вынесен на референдум в…", "ro": [], "a": 1, "e": "2004 год, 24 апреля. Греки-киприоты проголосовали примерно на 76% «против»."}, {"id": "7.8", "ch": 7, "q": "Επί προεδρίας ποιου έγινε το δημοψήφισμα για το σχέδιο Ανάν;", "o": ["Γλαύκου Κληρίδη", "Τάσσου Παπαδόπουλου", "Δημήτρη Χριστόφια", "Νίκου Αναστασιάδη"], "ru": "При каком президенте прошёл референдум по плану Аннана?", "ro": [], "a": 1, "e": "При Тассосе Пападопулосе."}, {"id": "7.9", "ch": 7, "q": "Πότε άνοιξαν για πρώτη φορά τα σημεία διέλευσης κατά μήκος της Πράσινης Γραμμής;", "o": ["1974", "1983", "2003", "2008"], "ru": "Когда впервые открылись пункты пропуска?", "ro": [], "a": 2, "e": "2003 год, 23 апреля. Пешеходный КПП на улице Ледра работает с 2008 года."}, {"id": "7.10", "ch": 7, "q": "Η είσοδος στην Κυπριακή Δημοκρατία είναι παράνομη από το λιμάνι της…", "o": ["Κερύνειας", "Λεμεσού", "Πάφου", "Λάρνακας"], "ru": "Въезд в Республику Кипр незаконен через порт…", "ro": [], "a": 0, "e": "Кирения, оккупированный порт. Незаконным считается и въезд через аэропорт Эрджан. (Июль 2026 II.)"}, {"id": "7.11", "ch": 7, "q": "Σε ποια χώρα έγινε η Διάσκεψη για το Κυπριακό στο Κραν Μοντανά το 2017;", "o": ["Αυστρία", "Ελβετία", "Γαλλία", "ΗΠΑ"], "ru": "В какой стране прошла конференция в Кран-Монтане в 2017 году?", "ro": [], "a": 1, "e": "Швейцария."}, {"id": "7.12", "ch": 7, "q": "Ποια είναι η κύρια διαφορά της Κύπρου με την Τουρκία;", "o": ["Το εμπόριο", "Η τουριστική ανταγωνιστικότητα", "Η τουρκική κατοχή του βόρειου τμήματος του νησιού", "Η γλώσσα"], "ru": "Главный спор Кипра с Турцией?", "ro": [], "a": 2, "e": "Турецкая оккупация северной части острова."}, {"id": "7.13", "ch": 7, "q": "Ποιο είναι το μοναδικό χωριό στη νεκρή ζώνη όπου ζουν μαζί Ελληνοκύπριοι και Τουρκοκύπριοι;", "o": ["Αθηένου", "Πύλα", "Δένεια", "Αστρομερίτης"], "ru": "Единственная деревня в буферной зоне, где вместе живут греки- и турки-киприоты?", "ro": [], "a": 1, "e": "Пила (район Ларнаки)."}, {"id": "7.14", "ch": 7, "q": "Ποιο από τα παρακάτω ΔΕΝ είναι ένα από τα τέσσερα νέα σημεία διέλευσης που συζητούνται;", "o": ["Μια Μηλιά", "Κόκκινα", "Πύλα–Πέργαμος", "Λουρουτζίνα"], "ru": "Что НЕ входит в четыре обсуждаемых новых КПП? (варианты — по состоянию на 2025; в пакете 2026 Коккины уже нет)", "ro": [], "a": 2, "e": "Пила–Пергамос. Обсуждаются Мья Милья, Коккина, Луруджина и Пирой–Атиену (по состоянию на 2025; в пакете 2026 Коккины уже нет). Ответы к главе 8"}, {"id": "8.1", "ch": 8, "q": "Ποια από τις ακόλουθες πληροφορίες για την Κύπρο είναι λανθασμένη;", "o": ["Η θητεία στην Εθνική Φρουρά είναι υποχρεωτική για τους άρρενες Κύπριους πολίτες.", "Η Κυπριακή Δημοκρατία εντάχθηκε στην Ευρωζώνη το 2008.", "Το πολιτικό σύστημα της Κύπρου είναι προεδρευόμενη δημοκρατία.", "Η Κύπρος διαθέτει Υφυπουργείο Ναυτιλίας και όχι Υπουργείο Ναυτιλίας."], "ru": "Что неверно?", "ro": ["Служба в Нацгвардии обязательна для мужчин-граждан", "Кипр вступил в еврозону в 2008", "политическая система Кипра — «προεδρευόμενη» (парламентская с президентом)", "у Кипра замминистерство, а не министерство судоходства"], "a": 2, "e": "Кипр — προεδρική δημοκρατία (президентская республика). «Προεδρευόμενη» — это модель Греции: парламентская республика с президентом без реальной власти. Остальные утверждения верны, в том числе про замминистерство судоходства. (Июль 2026 II.)"}, {"id": "8.2", "ch": 8, "q": "Ποια από τις ακόλουθες δηλώσεις για την Κυπριακή Δημοκρατία είναι λανθασμένη;", "o": ["Το πολίτευμα είναι Προεδρική Δημοκρατία.", "Αρχηγός του κράτους και της κυβέρνησης είναι ο Πρόεδρος.", "Οι τελευταίες βουλευτικές εκλογές έγιναν στις 24 Μαΐου 2026.", "Ο αριθμός των μελών της Βουλής των Αντιπροσώπων είναι 48."], "ru": "Что неверно?", "ro": ["Строй — президентская республика", "глава государства и правительства — президент", "последние выборы 24 мая 2026", "членов парламента — 48"], "a": 3, "e": "В парламенте работают 56 членов, всего мест 80. Числа 48 нет вообще. (Июль 2026 I.)"}, {"id": "8.3", "ch": 8, "q": "Ποιο από τα ακόλουθα δεν περιλαμβάνεται στις αρμοδιότητες της Βουλής των Αντιπροσώπων;", "o": ["Η αναθεώρηση του Συντάγματος", "Η έγκριση του ετήσιου κρατικού προϋπολογισμού", "Ο διορισμός του Γενικού Εισαγγελέα", "Η ψήφιση νόμων"], "ru": "Что НЕ входит в полномочия Палаты представителей?", "ro": [], "a": 2, "e": "Генерального прокурора назначает президент, а не парламент. (Июль 2026 I.)"}, {"id": "8.4", "ch": 8, "q": "Ποια από τις ακόλουθες πληροφορίες για το πολιτειακό σύστημα είναι λανθασμένη;", "o": ["Ο Πρόεδρος εκλέγεται για πέντε χρόνια", "Οι βουλευτές εκλέγονται για πέντε χρόνια", "Η Βουλή λειτουργεί σήμερα με 56 μέλη", "Οι Υπουργοί δικαιούνται ταυτόχρονα να είναι και βουλευτές"], "ru": "Что неверно?", "ro": ["Президент избирается на 5 лет", "депутаты — на 5 лет", "в парламенте сегодня 56 членов", "министры могут одновременно быть депутатами"], "a": 3, "e": "Министры не могут одновременно быть депутатами: это разделение властей. (Март 2026.)"}, {"id": "8.5", "ch": 8, "q": "Από τους πιο κάτω αξιωματούχους, ανεξάρτητος αξιωματούχος είναι ο…", "o": ["Υπουργός Εξωτερικών", "Κυβερνητικός Εκπρόσωπος", "Γενικός Εισαγγελέας", "Αρχηγός Αστυνομίας"], "ru": "Независимое должностное лицо — …", "ro": [], "a": 2, "e": "Генеральный прокурор. Министр, пресс-секретарь и начальник полиции независимыми не являются. (Июль 2026 II.)"}, {"id": "8.6", "ch": 8, "q": "Ποιος από τους ακόλουθους δεν είναι ανεξάρτητος αξιωματούχος;", "o": ["Αρχηγός Αστυνομίας", "Γενικός Ελεγκτής", "Γενικός Εισαγγελέας", "Επίτροπος Διοικήσεως"], "ru": "Кто НЕ является независимым должностным лицом?", "ro": [], "a": 0, "e": "Начальник полиции, он подчиняется Минюсту. (Июль 2025.)"}, {"id": "8.7", "ch": 8, "q": "Σε ποιο Υπουργείο υπάγεται η Υπηρεσία Υδρογονανθράκων;", "o": ["Ενέργειας, Εμπορίου και Βιομηχανίας", "Εργασίας", "Έρευνας, Καινοτομίας και Ψηφιακής Πολιτικής", "Γεωργίας"], "ru": "Какому министерству подчиняется Служба углеводородов?", "ro": [], "a": 0, "e": "Министерство энергетики, торговли и промышленности («углеводороды = газ = энергия»). (Июль 2026 II.)"}, {"id": "8.8", "ch": 8, "q": "Ποιο υπουργείο είναι αρμόδιο για το Τμήμα Φορολογίας;", "o": ["Εσωτερικών", "Άμυνας", "Οικονομικών", "Δικαιοσύνης"], "ru": "Какое министерство отвечает за налоговый департамент?", "ro": [], "a": 2, "e": "Министерство финансов. (Июль 2025.)"}, {"id": "8.9", "ch": 8, "q": "Εθνική Εποπτική Αρχή για τις τράπεζες στην Κύπρο είναι:", "o": ["το Υπουργείο Οικονομικών", "η Βουλή των Αντιπροσώπων", "η Κεντρική Τράπεζα της Κύπρου", "ο Γενικός Εισαγγελέας"], "ru": "Национальный надзорный орган за банками — …", "ro": [], "a": 2, "e": "Центральный банк Кипра. (Июль 2026 II.)"}, {"id": "8.10", "ch": 8, "q": "Ποιος διορίζει το Υπουργικό Συμβούλιο;", "o": ["Η Βουλή", "Ο Πρόεδρος της Δημοκρατίας", "Ο Πρόεδρος μαζί με τη Βουλή", "Ο λαός"], "ru": "Кто назначает Совет министров?", "ro": [], "a": 1, "e": "Президент назначает министров единолично."}, {"id": "8.11", "ch": 8, "q": "Ποιος εκλέγεται απευθείας από τον λαό;", "o": ["Ο Πρόεδρος της Βουλής", "Ο Πρόεδρος της Δημοκρατίας", "Οι Υπουργοί", "Ο Γενικός Εισαγγελέας"], "ru": "Кого народ избирает напрямую?", "ro": [], "a": 1, "e": "Президент Республики. Председателя Палаты избирают депутаты, министров и генпрокурора назначает президент."}, {"id": "8.12", "ch": 8, "q": "Ο Πρόεδρος της Βουλής εκλέγεται…", "o": ["από τον λαό", "από τους βουλευτές", "από τον Πρόεδρο της Δημοκρατίας", "από το Υπουργικό Συμβούλιο"], "ru": "Председатель Палаты избирается…", "ro": [], "a": 1, "e": "Его избирают сами депутаты."}, {"id": "8.13", "ch": 8, "q": "Ποιο είναι το ελάχιστο ποσοστό (όριο) για την εκλογή κόμματος στη Βουλή;", "o": ["1,8%", "3,6%", "5%", "10%"], "ru": "Какой минимальный процент (порог) нужен партии для прохода в парламент?", "ro": [], "a": 1, "e": "3,6%."}, {"id": "8.14", "ch": 8, "q": "Ποιος μπορεί να εκφράσει δυσπιστία προς το Υπουργικό Συμβούλιο;", "o": ["Η Βουλή", "Ο Πρόεδρος της Βουλής", "Κανείς", "Ο Γενικός Εισαγγελέας"], "ru": "Кто может выразить недоверие Совету министров?", "ro": [], "a": 2, "e": "Никто: в президентской республике вотума недоверия нет."}, {"id": "8.15", "ch": 8, "q": "Μετά τη μεταρρύθμιση του 2023, η ανώτατη δικαστική εξουσία ασκείται από…", "o": ["μόνο το Ανώτατο Δικαστήριο", "το Ανώτατο Δικαστήριο και το Ανώτατο Συνταγματικό Δικαστήριο", "το Εφετείο", "τη Βουλή"], "ru": "После реформы 2023 года высшую судебную власть осуществляют…", "ro": [], "a": 1, "e": "Верховный суд и Верховный конституционный суд."}, {"id": "8.16", "ch": 8, "q": "Πόσο είναι το μέγιστο συνολικό διάστημα που μπορεί κάποιος να είναι Πρόεδρος με δύο συνεχόμενες θητείες;", "o": ["8 χρόνια", "10 χρόνια", "12 χρόνια", "απεριόριστα"], "ru": "Максимальный срок пребывания президентом при двух сроках подряд?", "ro": [], "a": 1, "e": "10 лет: два срока по 5 лет. (Июль 2024.) Ответы к главе 9"}, {"id": "9.1", "ch": 9, "q": "Ποια από τα ακόλουθα περιλαμβάνει μόνο κόμματα/κινήματα που δεν εξασφάλισαν έδρα στις βουλευτικές εκλογές της 24ης Μαΐου 2026;", "o": ["ΔΗ.ΠΑ., Άμεση Δημοκρατία, ΑΛΜΑ", "ΑΛΜΑ, Volt, ΕΔΕΚ", "Volt, Άμεση Δημοκρατία, Κίνημα Οικολόγων", "Κίνημα Οικολόγων, ΔΗ.ΠΑ., ΕΔΕΚ"], "ru": "Какой вариант содержит только партии/движения, НЕ получившие мест на выборах 24 мая 2026?", "ro": [], "a": 3, "e": "Не прошли Экологи, ΔΗ.ΠΑ. и ΕΔΕΚ («ЭДЭ вылетели»). ΑΛΜΑ и Άμεση Δημοκρατία получили по 4 места, поэтому варианты α, β, γ неверны. (Июль 2026 I.)"}, {"id": "9.2", "ch": 9, "q": "Τα δύο μεγαλύτερα κόμματα στη Βουλή των Αντιπροσώπων είναι…", "o": ["ΔΗΣΥ – ΔΗΚΟ", "ΔΗΣΥ – ΑΚΕΛ", "ΑΚΕΛ – ΔΗΚΟ", "ΔΗΣΥ – ΕΔΕΚ"], "ru": "Две крупнейшие партии в Палате представителей — …", "ro": [], "a": 1, "e": "ΔΗΣΥ (17) и ΑΚΕΛ (15). (Март 2026, июль 2024.)"}, {"id": "9.3", "ch": 9, "q": "Ο Πρόεδρος του Δημοκρατικού Κόμματος (ΔΗΚΟ) είναι ο…", "o": ["Χρύσης Παντελίδης", "Νικόλας Παπαδόπουλος", "Πανίκος Λεωνίδου", "Ζαχαρίας Κουλίας"], "ru": "Председатель Демократической партии (ΔΗΚΟ) — …", "ro": [], "a": 1, "e": "Νικόλας Παπαδόπουλος, сын президента Τάσσου Παπαδόπουλου. (Июль 2026 II.)"}, {"id": "9.4", "ch": 9, "q": "Ποιος/-α είναι ο/η Υπουργός Μεταφορών, Επικοινωνιών και Έργων;", "o": ["Ευανθία Τσολάκη", "Αθηνά Μιχαηλίδου", "Βασίλης Πάλμας", "Μιχάλης Δαμιανός"], "ru": "Кто министр транспорта, связи и работ?", "ro": [], "a": 0, "e": "Ευανθία (Εύη) Τσολάκη, с 6 августа 2026. Μιχαηλίδου — образование, Πάλμας — оборона, Δαμιανός — энергетика. (Июль 2026 I.)"}, {"id": "9.5", "ch": 9, "q": "Ο Υπουργός Άμυνας της Κυπριακής Δημοκρατίας είναι ο…", "o": ["Βασίλης Πάλμας", "Κώστας Φυτιρής", "Κωνσταντίνος Κόμπος", "Μάριος Καρογιάν"], "ru": "Министр обороны — …", "ro": [], "a": 0, "e": "Βασίλης Πάλμας. Φυτιρής — юстиция, Κόμπος — МИД, Καρογιάν — лидер ΔΗ.ΠΑ. (Март 2026.)"}, {"id": "9.6", "ch": 9, "q": "Ο Γενικός Εισαγγελέας της Κυπριακής Δημοκρατίας είναι ο…", "o": ["Νικόλας Παπαδόπουλος", "Μαρίνος Μουσιούττας", "Χριστόδουλος Πατσαλίδης", "Γιώργος Σαββίδης"], "ru": "Генеральный прокурор — …", "ro": [], "a": 3, "e": "Γιώργος Σαββίδης. Πατσαλίδης — ЦБ. (Март 2026.)"}, {"id": "9.7", "ch": 9, "q": "Ο σημερινός ηγέτης της τουρκοκυπριακής κοινότητας είναι ο…", "o": ["Μεχμέτ Αλί Ταλάτ", "Τουφάν Ερχιουρμάν", "Ντερβίς Έρογλου", "Μουσταφά Ακιντζί"], "ru": "Нынешний лидер турко-кипрской общины — …", "ro": [], "a": 1, "e": "Τουφάν Ερχιουρμάν, избран 19 октября 2025. Остальные — бывшие лидеры. (Март 2026.)"}, {"id": "9.8", "ch": 9, "q": "Η Πρόεδρος της Βουλής των Αντιπροσώπων που επανεξελέγη τον Ιούνιο του 2026 είναι η…", "o": ["Χριστιάνα Ερωτοκρίτου", "Αννίτα Δημητρίου", "Ειρήνη Πική", "Μαριλένα Ραουνά"], "ru": "Председатель Палаты, переизбранная в июне 2026, — …", "ro": [], "a": 1, "e": "Αννίτα Δημητρίου, переизбрана 4 июня 2026. (Июль 2026 II.)"}, {"id": "9.9", "ch": 9, "q": "Ποιος ήταν ο πρώτος Πρόεδρος της Κυπριακής Δημοκρατίας;", "o": ["Γλαύκος Κληρίδης", "Σπύρος Κυπριανού", "Αρχιεπίσκοπος Μακάριος Γ΄", "Νίκος Σαμψών"], "ru": "Кто был первым президентом?", "ro": [], "a": 2, "e": "Архиепископ Макариос III (1960–1977). (Июль 2026 I, июль 2023.)"}, {"id": "9.10", "ch": 9, "q": "Σε ποια πόλη γεννήθηκε ο Πρόεδρος Νίκος Χριστοδουλίδης;", "o": ["Λεμεσό", "Γεροσκήπου (Πάφος)", "Λάρνακα", "Λευκωσία"], "ru": "Где родился президент Никос Христодулидис?", "ro": [], "a": 1, "e": "Γεροσκήπου, район Пафоса. (Февраль 2025.)"}, {"id": "9.11", "ch": 9, "q": "Πόσες αλλαγές στο Υπουργικό Συμβούλιο ανακοίνωσε ο Πρόεδρος στις 5 Δεκεμβρίου 2025;", "o": ["δύο", "τέσσερις", "έξι", "οκτώ"], "ru": "Сколько изменений в правительстве объявил президент 5 декабря 2025?", "ro": [], "a": 2, "e": "Шесть изменений; присяга прошла 8 декабря. (Набор «февраль 2025» приложения.)"}, {"id": "9.12", "ch": 9, "q": "Κατά την προεδρία ποιου έγινε το δημοψήφισμα για το σχέδιο Ανάν;", "o": ["Γλαύκου Κληρίδη", "Τάσσου Παπαδόπουλου", "Δημήτρη Χριστόφια", "Νίκου Αναστασιάδη"], "ru": "При каком президенте прошёл референдум по плану Аннана?", "ro": [], "a": 1, "e": "Τάσσος Παπαδόπουλος, 2004. (Набор «февраль 2024».)"}, {"id": "9.13", "ch": 9, "q": "Πόσους ευρωβουλευτές εκλέγει η Κύπρος;", "o": ["4", "6", "8", "12"], "ru": "Сколько евродепутатов избирает Кипр?", "ro": [], "a": 1, "e": "6."}, {"id": "9.14", "ch": 9, "q": "Ποια είναι η Υφυπουργός Ευρωπαϊκών Θεμάτων;", "o": ["Μαριλένα Ραουνά", "Μαρίνα Χατζημανώλη", "Τίνα Παύλου", "Αθηνά Μιχαηλίδου"], "ru": "Кто замминистра по делам ЕС?", "ro": [], "a": 0, "e": "Μαριλένα Ραουνά (замминистерство существовало в 2024 – июле 2026). Χατζημανώλη — судоходство, Παύλου — соцобеспечение."}, {"id": "9.15", "ch": 9, "q": "Ποιο κόμμα αύξησε περισσότερο τις έδρες του στις εκλογές του 2026 (από 4 σε 8);", "o": ["ΔΗΚΟ", "ΑΚΕΛ", "ΕΛΑΜ", "ΔΗΣΥ"], "ru": "Какая партия больше всех увеличила число мест в 2026 году (с 4 до 8)?", "ro": [], "a": 2, "e": "ΕΛΑΜ: с 4 до 8 мест."}, {"id": "9.16", "ch": 9, "q": "Τι σημαίνουν τα αρχικά ΔΗΣΥ;", "o": ["Δημοκρατική Συμμαχία", "Δημοκρατικός Συναγερμός", "Δημοκρατικό Σύνταγμα", "Δημοκρατική Συνεργασία"], "ru": "Что означает аббревиатура ΔΗΣΥ?", "ro": [], "a": 1, "e": "Δημοκρατικός Συναγερμός."}, {"id": "9.17", "ch": 9, "q": "Ποιος είναι ο Κυβερνητικός Εκπρόσωπος;", "o": ["Κωνσταντίνος Λετυμπιώτης", "Κωνσταντίνος Κόμπος", "Κωνσταντίνος Ιωάννου", "Κώστας Κουμής"], "ru": "Кто правительственный представитель (пресс-секретарь)?", "ro": [], "a": 0, "e": "Κωνσταντίνος Λετυμπιώτης. Три других Константина: Кόμπος — МИД, Ιωάννου — МВД, Κουμής (Κώστας) — туризм. Ответы к главе 10"}, {"id": "10.1", "ch": 10, "q": "Δίνονται τα γεγονότα: α. Ένταξη στην ΕΕ β. Ανακήρυξη σε ανεξάρτητο κράτος γ. Ένταξη στη Ζώνη του Ευρώ δ. Εισβολή της Τουρκίας. Ποια είναι η σωστή χρονολογική σειρά (από το παλαιότερο);", "o": ["δ – α – γ – β", "β – δ – α – γ", "δ – β – α – γ", "β – α – δ – γ"], "ru": "Даны события:", "ro": ["вступление в ЕС,", "независимость,", "еврозона,", "вторжение Турции. Каков правильный порядок (от самого раннего)?"], "a": 1, "e": "β – δ – α – γ: 1960 → 1974 → 2004 → 2008 («60-74-04-08»). (Март 2026, июль 2025.)"}, {"id": "10.2", "ch": 10, "q": "Η Κύπρος ανέλαβε την Προεδρία του Συμβουλίου της ΕΕ…", "o": ["το δεύτερο εξάμηνο του 2012 και το πρώτο εξάμηνο του 2026", "το δεύτερο εξάμηνο του 2012 μόνο", "το δεύτερο εξάμηνο του 2018 και το πρώτο του 2026", "το πρώτο εξάμηνο του 2026 μόνο"], "ru": "Кипр председательствовал в Совете ЕС…", "ro": [], "a": 0, "e": "Второе полугодие 2012 и первое полугодие 2026. (Июль 2026 II.)"}, {"id": "10.3", "ch": 10, "q": "Ο Κύπριος Επίτροπος, κος Κ. Καδής, είναι αρμόδιος για…", "o": ["Γεωργία και τρόφιμα", "Μεσόγειο", "Διεύρυνση", "Αλιεία και Ωκεανούς"], "ru": "Кипрский комиссар К. Кадис отвечает за…", "ro": [], "a": 3, "e": "Рыболовство и океаны. (Март 2026; набор «февраль 2024» приложения.)"}, {"id": "10.4", "ch": 10, "q": "Η προσωπική απεσταλμένη του Γενικού Γραμματέα του ΟΗΕ για το Κυπριακό είναι η…", "o": ["Μαρία Άνχελα Ολγκίν", "Ρομπέρτα Μετσόλα", "Ούρσουλα φον ντερ Λάιεν", "Κάγια Κάλλας"], "ru": "Личный посланник Генсека ООН по Кипру — …", "ro": [], "a": 0, "e": "Мария Анхела Ольгин (Колумбия, ООН). Остальные три — руководители институтов ЕС. (Июль 2025.)"}, {"id": "10.5", "ch": 10, "q": "Πότε η Κύπρος έγινε κράτος-μέλος της ΕΕ;", "o": ["1990", "2003", "2004", "2008"], "ru": "Когда Кипр стал членом ЕС?", "ro": [], "a": 2, "e": "2004 (1 мая). В 2003 году подписали договор, в 2008 году перешли на евро. (Февраль 2024.)"}, {"id": "10.6", "ch": 10, "q": "Πόσους μήνες διαρκεί η Προεδρία ενός κράτους στο Συμβούλιο της ΕΕ;", "o": ["3", "6", "12", "24"], "ru": "Сколько месяцев длится председательство одной страны в Совете ЕС?", "ro": [], "a": 1, "e": "6 месяцев. (Февраль 2024.)"}, {"id": "10.7", "ch": 10, "q": "Ποιο είναι το σύνθημα της Κυπριακής Προεδρίας του 2026;", "o": ["«Προς μια καλύτερη Ευρώπη»", "«Μια Αυτόνομη Ένωση. Ανοιχτή στον Κόσμο»", "«Ενωμένοι στη διαφορετικότητα»", "«Ευρώπη της Μεσογείου»"], "ru": "Каков девиз кипрского председательства 2026?", "ro": [], "a": 1, "e": "«Μια Αυτόνομη Ένωση. Ανοιχτή στον Κόσμο». «Ενωμένοι στη διαφορετικότητα» — девиз всего ЕС."}, {"id": "10.8", "ch": 10, "q": "Το άρθρο 42(7) της Συνθήκης για την ΕΕ αφορά…", "o": ["το ευρώ", "την αμοιβαία άμυνα (συνδρομή)", "τη μετανάστευση", "την αλιεία"], "ru": "Статья 42(7) Договора о ЕС касается…", "ro": [], "a": 1, "e": "Взаимная оборона, то есть пункт о взаимной помощи."}, {"id": "10.9", "ch": 10, "q": "Σε ποιον οργανισμό ΔΕΝ είναι μέλος η Κύπρος;", "o": ["ΟΗΕ", "ΝΑΤΟ", "Ευρωπαϊκή Ένωση", "Κοινοπολιτεία"], "ru": "Членом какой организации Кипр НЕ является?", "ro": [], "a": 1, "e": "НАТО."}, {"id": "10.10", "ch": 10, "q": "Ποιος Ευρωπαίος Επίτροπος δήλωσε τον Ιανουάριο του 2026 ότι η Πράσινη Γραμμή δεν θα εμποδίσει την ένταξη της Κύπρου στη Σένγκεν;", "o": ["Κώστας Καδής", "Magnus Brunner", "Κάγια Κάλλας", "Ούρσουλα φον ντερ Λάιεν"], "ru": "Какой еврокомиссар в январе 2026 заявил, что Зелёная линия не помешает вступлению Кипра в Шенген?", "ro": [], "a": 1, "e": "Магнус Бруннер (внутренние дела и миграция)."}, {"id": "10.11", "ch": 10, "q": "Με ποια χώρα υπέγραψε η Κύπρος συμφωνία οριοθέτησης θαλάσσιων ζωνών στις 26 Νοεμβρίου 2025;", "o": ["Ισραήλ", "Αίγυπτο", "Λίβανο", "Ελλάδα"], "ru": "С какой страной Кипр 26 ноября 2025 подписал соглашение о разграничении морских зон?", "ro": [], "a": 2, "e": "Ливан."}, {"id": "10.12", "ch": 10, "q": "Στις 15–16 Ιουνίου 2025 επισκέφτηκε την Κύπρο ο Πρωθυπουργός της…", "o": ["Ελλάδας", "Ινδίας", "Ισπανίας", "Γαλλίας"], "ru": "15–16 июня 2025 года Кипр посетил премьер-министр…", "ro": [], "a": 1, "e": "Индия (Нарендра Моди). (Июль 2025; набор «февраль 2024» приложения.)"}, {"id": "10.13", "ch": 10, "q": "Ποια χώρα ΔΕΝ έστειλε στρατιωτική βοήθεια στην Κύπρο μετά την επίθεση με drone στο Ακρωτήρι τον Μάρτιο του 2026;", "o": ["Ελλάδα", "Γαλλία", "Γερμανία", "Ιταλία"], "ru": "Какая страна НЕ прислала военную помощь после удара дрона по Акротири в марте 2026? (по ключу банка; на деле немецкий фрегат тоже пришёл в Лимасол)", "ro": [], "a": 2, "e": "Германия (по ключу банка; на деле немецкий фрегат тоже пришёл в Лимасол). Греция, Великобритания, Франция, Италия, Нидерланды и Испания силы прислали."}, {"id": "10.14", "ch": 10, "q": "Πότε η Κύπρος φιλοξένησε για πρώτη φορά άτυπη σύνοδο των αρχηγών κρατών και κυβερνήσεων της ΕΕ;", "o": ["Δεκέμβριος 2012", "23–24 Απριλίου 2026", "1 Μαΐου 2004", "30 Ιουνίου 2026"], "ru": "Когда Кипр впервые принимал неформальный саммит глав государств и правительств ЕС?", "ro": [], "a": 1, "e": "23–24 апреля 2026."}, {"id": "10.15", "ch": 10, "q": "Ποιοι συμμετέχουν στη διαδικασία «5+1» για το Κυπριακό;", "o": ["Οι δύο κοινότητες, Ελλάδα, Τουρκία, Ηνωμένο Βασίλειο και ΟΗΕ", "Τα 5 μόνιμα μέλη του Συμβουλίου Ασφαλείας και η ΕΕ", "5 κράτη της ΕΕ και η Τουρκία", "Οι δύο κοινότητες, ΗΠΑ, Ρωσία, ΕΕ και ΟΗΕ"], "ru": "Кто участвует в формате «5+1» по кипрской проблеме?", "ro": [], "a": 0, "e": "Две общины, три гаранта (Греция, Турция, Великобритания) и ООН."}, {"id": "10.16", "ch": 10, "q": "Η εκστρατεία «Αμάλθεια» είναι…", "o": ["θαλάσσιος ανθρωπιστικός διάδρομος προς τη Γάζα", "πρόγραμμα για το νερό", "στρατιωτική άσκηση", "πολιτιστικό φεστιβάλ"], "ru": "«Амальтея» — это…", "ro": [], "a": 0, "e": "Морской гуманитарный коридор в Газу. Ответы к главе 11"}, {"id": "11.1", "ch": 11, "q": "Ο σημερινός Αρχιεπίσκοπος της Ελληνορθόδοξης Εκκλησίας της Κύπρου είναι ο…", "o": ["Γεώργιος", "Χρυσόστομος Α΄", "Χρυσόστομος Β΄", "Μακάριος Γ΄"], "ru": "Нынешний архиепископ Православной церкви Кипра — …", "ro": [], "a": 0, "e": "Γεώργιος (с декабря 2022). Остальные трое — его предшественники. (Июль 2026 I.)"}, {"id": "11.2", "ch": 11, "q": "Το γνωστό Μοναστήρι της Παναγίας του Κύκκου βρίσκεται στην…", "o": ["Πεδιάδα της Μεσαορίας", "Οροσειρά του Πενταδακτύλου", "Οροσειρά του Τροόδους", "Επαρχία Πάφου"], "ru": "Знаменитый монастырь Панагии Киккской находится…", "ro": [], "a": 2, "e": "Хребет Троодос. (Март 2026.)"}, {"id": "11.3", "ch": 11, "q": "Ποια από τις πιο κάτω ημέρες είναι αργία μόνο για τα σχολεία;", "o": ["Ημέρα Ανεξαρτησίας", "Ονομαστήρια του Αρχιεπισκόπου", "25η Μαρτίου", "Καθαρή Δευτέρα"], "ru": "Какой из этих дней — выходной только для школ?", "ro": [], "a": 1, "e": "Именины архиепископа — выходной только для школ. Остальные три — общие праздники. (Июль 2026 I.)"}, {"id": "11.4", "ch": 11, "q": "Ιδρυτής της Εκκλησίας της Κύπρου θεωρείται ο…", "o": ["Απόστολος Παύλος", "Απόστολος Βαρνάβας", "Άγιος Λάζαρος", "Απόστολος Ανδρέας"], "ru": "Основателем Церкви Кипра считается…", "ro": [], "a": 1, "e": "Апостол Варнава."}, {"id": "11.5", "ch": 11, "q": "Ποια θρησκευτική ομάδα ΔΕΝ είναι αναγνωρισμένη από το Σύνταγμα ως θρησκευτική ομάδα;", "o": ["Αρμένιοι", "Μαρωνίτες", "Λατίνοι", "Προτεστάντες"], "ru": "Какая группа НЕ признана Конституцией как религиозная группа?", "ro": [], "a": 3, "e": "Протестанты. Признаны армяне, марониты и латиняне."}, {"id": "11.6", "ch": 11, "q": "Ποια είναι η μεγαλύτερη θρησκευτική ομολογία στην Κύπρο;", "o": ["Καθολική", "Ελληνορθόδοξη", "Μουσουλμανική", "Αρμενική"], "ru": "Какая конфессия крупнейшая на Кипре?", "ro": [], "a": 1, "e": "Греческая православная. (Февраль 2025.)"}, {"id": "11.7", "ch": 11, "q": "Η εκκλησία του Αγίου Λαζάρου βρίσκεται στη…", "o": ["Λεμεσό", "Πάφο", "Λάρνακα", "Λευκωσία"], "ru": "Церковь Святого Лазаря находится в…", "ro": [], "a": 2, "e": "Ларнака (древний Китион)."}, {"id": "11.8", "ch": 11, "q": "Το Βυζαντινό Μουσείο της Λευκωσίας στεγάζεται…", "o": ["στο Κυπριακό Μουσείο", "στον χώρο της Ιεράς Αρχιεπισκοπής", "στο Προεδρικό Μέγαρο", "στη Βουλή"], "ru": "Византийский музей в Никосии размещается…", "ro": [], "a": 1, "e": "На территории Священной Архиепископии. (Июль 2026 I.)"}, {"id": "11.9", "ch": 11, "q": "Η αυτοκεφαλία της Εκκλησίας της Κύπρου αναγνωρίστηκε από την Οικουμενική Σύνοδο της Εφέσου το έτος…", "o": ["45", "330", "431", "1191"], "ru": "Автокефалию Церкви Кипра признал Эфесский собор в году…", "ro": [], "a": 2, "e": "431 год."}, {"id": "11.10", "ch": 11, "q": "Ποιο μοναστήρι ίδρυσε, σύμφωνα με την παράδοση, η Αγία Ελένη;", "o": ["Κύκκου", "Σταυροβουνίου", "Μαχαιρά", "Αγίου Νεοφύτου"], "ru": "Какой монастырь, по преданию, основала Святая Елена?", "ro": [], "a": 1, "e": "Ставровуни («Крестовая гора»)."}, {"id": "11.11", "ch": 11, "q": "Πόσες ζωγραφιστές εκκλησίες του Τροόδους είναι στον κατάλογο Παγκόσμιας Κληρονομιάς της UNESCO;", "o": ["5", "7", "10", "12"], "ru": "Сколько расписных церквей Троодоса в списке Всемирного наследия ЮНЕСКО?", "ro": [], "a": 2, "e": "10 (1985 и 2001 годы)."}, {"id": "11.12", "ch": 11, "q": "Πόσες θρησκευτικές κοινότητες αναγνωρίζει το Σύνταγμα της Κυπριακής Δημοκρατίας;", "o": ["δύο", "τρεις", "τέσσερις", "πέντε"], "ru": "Сколько религиозных общин признаёт Конституция?", "ro": [], "a": 3, "e": "Пять: православные, мусульмане, армяне, марониты, латиняне (строго по Конституции — 2 общины + 3 религиозные группы). (Халлуминати.)"}, {"id": "11.13", "ch": 11, "q": "Προς τιμή ποιου αγίου ονομάζουν πιο συχνά τα παιδιά στην Κύπρο;", "o": ["Αγίου Γεωργίου", "Αγίου Ανδρέα", "Αγίου Νικολάου", "Αγίου Λαζάρου"], "ru": "В честь какого святого чаще всего называют детей на Кипре?", "ro": [], "a": 1, "e": "Святого Андрея. Монастырь Апостола Андрея — на Карпасе. (Халлуминати.)"}, {"id": "11.14", "ch": 11, "q": "Πού βρίσκεται ο τάφος του Αρχιεπισκόπου Μακαρίου Γ΄;", "o": ["στον Άγιο Λάζαρο", "στο Θρονί, κοντά στη Μονή Κύκκου", "στη Μονή Σταυροβουνίου", "στην Πάνω Παναγιά"], "ru": "Где находится могила архиепископа Макариоса III?", "ro": [], "a": 1, "e": "На Θρονί у монастыря Киккос. В Пано Панагии он родился. Ответы к главе 12"}, {"id": "12.1", "ch": 12, "q": "Τραπεζική αργία στην Κύπρο είναι…", "o": ["η ονομαστική γιορτή του Προέδρου", "τα ονομαστήρια του Αρχιεπισκόπου", "η επέτειος ένταξης στην ΕΕ", "η Μεγάλη Παρασκευή"], "ru": "Банковский выходной на Кипре — …", "ro": [], "a": 3, "e": "Страстная пятница (по ключу; на деле это полноценная δημόσια αργία, а чисто банковский выходной — вторник после Пасхи). Именины архиепископа — выходной только для школ; два остальных дня вообще не выходные. (Июль 2026 II.)"}, {"id": "12.2", "ch": 12, "q": "Στις πιο κάτω δηλώσεις αναφέρονται έθιμα. Ποιο είναι λανθασμένο;", "o": ["Την ημέρα του Κατακλυσμού οργανώνονται θαλάσσια αγωνίσματα.", "Την Καθαρή Δευτέρα γίνονται εκδρομές στη φύση με νηστίσιμα φαγητά.", "Τη Μεγάλη Παρασκευή γίνεται η περιφορά του Επιταφίου.", "Η ημέρα των Φώτων είναι η ημέρα που κόβουμε τη Βασιλόπιτα."], "ru": "Какое утверждение об обычаях неверно?", "ro": ["В Катаклизмос — морские состязания", "в Чистый понедельник — выезды на природу с постной едой", "в Великую пятницу — вынос Плащаницы", "на Φώτα режут василопиту"], "a": 3, "e": "Василопиту режут 1 января, а не на Φώτα. (Июль 2026 I.)"}, {"id": "12.3", "ch": 12, "q": "Ποιο από τα ακόλουθα έθιμα είναι λανθασμένο;", "o": ["Τα Θεοφάνεια γίνεται ο αγιασμός των υδάτων.", "Την ημέρα της Ανάστασης γίνεται η «Λαμπρατζιά».", "Τα Χριστούγεννα γίνεται το ψήσιμο των φλαούνων.", "Το Πάσχα τσουγκρίζουμε κόκκινα αυγά."], "ru": "Какой обычай указан неверно?", "ro": ["На Богоявление освящают воду", "в ночь Воскресения — лампрадзия", "на Рождество пекут флаунес", "на Пасху бьют красные яйца"], "a": 2, "e": "Флаунес пекут перед Пасхой, а не на Рождество. (Июль 2026 II.)"}, {"id": "12.4", "ch": 12, "q": "Η Κυριακή των Βαΐων (ή της Ελιάς) γιορτάζεται…", "o": ["την Κυριακή πριν το Πάσχα", "την Κυριακή μετά το Πάσχα", "την πρώτη Κυριακή του Γενάρη", "την τελευταία Κυριακή του Αυγούστου"], "ru": "Вербное (Оливковое) воскресенье празднуется…", "ro": [], "a": 0, "e": "В воскресенье перед Пасхой. (Июль 2026 I, февраль 2025.)"}, {"id": "12.5", "ch": 12, "q": "Ποια από τις πιο κάτω ημερομηνίες δεν είναι επίσημη αργία στην Κύπρο;", "o": ["1η Δεκεμβρίου", "1η Απριλίου", "1η Μαΐου", "1η Οκτωβρίου"], "ru": "Какая дата НЕ является официальным праздником?", "ro": [], "a": 0, "e": "1 декабря. Остальные три — праздники из ряда «четырёх первых чисел». (Март 2026.)"}, {"id": "12.6", "ch": 12, "q": "Οι Κύπριοι γιορτάζουν τα Θεοφάνια (Φώτα) με…", "o": ["αγιασμό των νερών και κατάδυση του Σταυρού", "σημαιοστολισμό των πόλεων", "εκδρομές με νηστίσιμα φαγητά", "παραδοσιακά παιχνίδια"], "ru": "Киприоты празднуют Богоявление…", "ro": [], "a": 0, "e": "Освящение вод и погружение креста. (Март 2026.)"}, {"id": "12.7", "ch": 12, "q": "Ο στολισμός και η περιφορά του Επιταφίου γίνεται την…", "o": ["Κυριακή του Πάσχα", "Μεγάλη Παρασκευή", "Πρωτομαγιά", "Καθαρή Δευτέρα"], "ru": "Украшение и вынос Плащаницы бывают в…", "ro": [], "a": 1, "e": "В Великую пятницу. (Март 2026, февраль 2024.)"}, {"id": "12.8", "ch": 12, "q": "Η Λαμπρατζιά σχετίζεται με τον εορτασμό…", "o": ["των Χριστουγέννων", "του Πάσχα", "του Κατακλυσμού", "του Καρναβαλιού"], "ru": "Лампрадзия связана с праздником…", "ro": [], "a": 1, "e": "С Пасхой. (Июль 2025.)"}, {"id": "12.9", "ch": 12, "q": "Ποια από τις ακόλουθες γιορτές δεν είναι δημόσια αργία στην Κύπρο;", "o": ["Ημέρα των Ευχαριστιών", "Εργατική Πρωτομαγιά", "Ημέρα Ανεξαρτησίας", "Καθαρή Δευτέρα"], "ru": "Какой из этих праздников НЕ является государственным выходным?", "ro": [], "a": 0, "e": "День благодарения — американский праздник. (Июль 2025.)"}, {"id": "12.10", "ch": 12, "q": "Η 15η Αυγούστου είναι…", "o": ["εργάσιμη ημέρα", "δημόσια αργία – Κοίμηση της Θεοτόκου", "μόνο τραπεζική αργία", "μόνο σχολική αργία"], "ru": "15 августа — это…", "ro": [], "a": 1, "e": "Государственный праздник, Успение. (Июль 2023.)"}, {"id": "12.11", "ch": 12, "q": "Σε ποια χωριά οργανώνεται γιορτή του ψαριού;", "o": ["Ζύγι και Λατσί", "Πύλα και Ορόκλινη", "Παραλίμνι και Πρωταράς", "Κάρμι και Καζάφανι"], "ru": "В каких деревнях проходит праздник рыбы?", "ro": [], "a": 0, "e": "Зиги и Лаци. (Июль 2026 I.)"}, {"id": "12.12", "ch": 12, "q": "Η 1η Απριλίου είναι εθνική επέτειος επειδή…", "o": ["τότε ανακηρύχθηκε η ανεξαρτησία", "τότε άρχισε ο απελευθερωτικός αγώνας της ΕΟΚΑ (1955)", "τότε έγινε η εισβολή", "τότε η Κύπρος εντάχθηκε στην ΕΕ"], "ru": "1 апреля — национальная годовщина, потому что…", "ro": [], "a": 1, "e": "Начало борьбы ΕΟΚΑ, 1 апреля 1955."}, {"id": "12.13", "ch": 12, "q": "Η Επέτειος του «Όχι» (28 Οκτωβρίου) σχετίζεται με…", "o": ["τον Β΄ Παγκόσμιο Πόλεμο", "την Επανάσταση του 1821", "την ανεξαρτησία της Κύπρου", "την ΕΟΚΑ"], "ru": "Годовщина «Όχι» (28 октября) связана с…", "ro": [], "a": 0, "e": "Вторая мировая война: отказ Греции Италии в 1940 году."}, {"id": "12.14", "ch": 12, "q": "Σε ποιο χωριό γίνεται η γιορτή του τριαντάφυλλου (Ανθεστήρια);", "o": ["Φοινί", "Αγρός", "Λεύκαρα", "Όμοδος"], "ru": "В какой деревне проходит праздник роз? (на самом деле Ανθεστήρια — городской праздник цветов в мае; праздник розы в Агросе — Γιορτή του Τριανταφύλλου)", "ro": [], "a": 1, "e": "Агрос. (Февраль 2025 — «Фестиваль роз».)"}, {"id": "12.15", "ch": 12, "q": "Πότε γιορτάζεται ο Κατακλυσμός;", "o": ["40 μέρες μετά το Πάσχα", "50 μέρες μετά το Πάσχα", "6 Ιανουαρίου", "15 Αυγούστου"], "ru": "Когда празднуют Катаклизмос?", "ro": [], "a": 1, "e": "Через 50 дней после Пасхи, в понедельник Святого Духа (на следующий день после Троицы)."}, {"id": "12.16", "ch": 12, "q": "Στην Κυριακή του Πάσχα, τσουγκρίζοντας τα αυγά, λέμε…", "o": ["«Καλά Χριστούγεννα»", "«Χριστός Ανέστη»", "«Χρόνια πολλά»", "«Καλή Σαρακοστή»"], "ru": "В Пасхальное воскресенье, стукаясь яйцами, говорят…", "ro": [], "a": 1, "e": "«Христос воскресе» (Χριστός Ανέστη). (Июль 2024.) Ответы к главе 13"}, {"id": "13.1", "ch": 13, "q": "Ποιο από τα πιο κάτω Μουσεία της Λευκωσίας στεγάζεται στον χώρο της Ιεράς Αρχιεπισκοπής;", "o": ["Το Αρχαιολογικό Μουσείο", "Το Λεβέντειο Δημοτικό Μουσείο", "Το Βυζαντινό Μουσείο", "Το Μουσείο Κυπριακής Αστυνομίας"], "ru": "Какой музей Никосии размещается на территории Архиепископии?", "ro": [], "a": 2, "e": "Византийский музей. (Июль 2026 I.)"}, {"id": "13.2", "ch": 13, "q": "Το Αρχοντικό του Χατζηγεωργάκη Κορνέσιου στη Λευκωσία λειτουργεί σήμερα ως…", "o": ["Κρατική Πινακοθήκη", "Εστιατόριο", "Κέντρο Χειροτεχνίας", "Εθνολογικό Μουσείο"], "ru": "Особняк Хаджигеоргакиса Корнесиоса сегодня служит…", "ro": [], "a": 3, "e": "Этнологический музей. (Июль 2026 II.)"}, {"id": "13.3", "ch": 13, "q": "Ποιο από τα πιο κάτω Μουσεία βρίσκεται στη Λάρνακα;", "o": ["Θεατρικό Μουσείο Κύπρου", "Μουσείο Παραμυθιού", "Μουσείο Πιερίδη", "Κάστρο Λεμεσού"], "ru": "Какой музей находится в Ларнаке?", "ro": [], "a": 2, "e": "Музей Пиеридиса. Театральный музей и замок — в Лимассоле, музей сказки — в Никосии. (Июль 2026 II, в другой версии вариантов.)"}, {"id": "13.4", "ch": 13, "q": "Το χωριό Λεύκαρα είναι παγκοσμίως γνωστό για τα παραδοσιακά…", "o": ["χειροποίητα κεντήματα", "δερμάτινα είδη", "κεραμικά αγγεία", "μαρμάρινα γλυπτά"], "ru": "Деревня Лефкара всемирно известна традиционными…", "ro": [], "a": 0, "e": "Ручные вышивки (λευκαρίτικα). (Июль 2026 II.)"}, {"id": "13.5", "ch": 13, "q": "Το χωριό Φοινί είναι γνωστό για την τέχνη των…", "o": ["κεντημάτων", "δερμάτων", "ενδυμάτων", "αγγείων"], "ru": "Деревня Фини известна искусством…", "ro": [], "a": 3, "e": "Сосуды, гончарство. (Март 2026.)"}, {"id": "13.6", "ch": 13, "q": "Τι ΔΕΝ ισχύει για την Κουμανδαρία; Είναι…", "o": ["από τα παλαιότερα κρασιά του κόσμου", "κόκκινο γλυκό κρασί", "το κρασί των Σταυροφόρων", "λευκό ξηρό κρασί"], "ru": "Что НЕ верно о коммандарии? Это…", "ro": [], "a": 3, "e": "Утверждение «белое сухое» — ложь: коммандария — сладкое вино. (Март 2026.)"}, {"id": "13.7", "ch": 13, "q": "Το κυπριακό λουκούμι, προϊόν ΠΓΕ από το 2007, έχει καταγωγή από…", "o": ["τον Αγρό", "τη Γεροσκήπου", "τη Χλώρακα", "το Φρέναρος"], "ru": "Кипрский лукум (ПГЕ с 2007) происходит из…", "ro": [], "a": 1, "e": "Героскипу. (Июль 2026 II.)"}, {"id": "13.8", "ch": 13, "q": "Ποιος αρχαιολογικός χώρος συμπεριλαμβάνεται στον κατάλογο Παγκόσμιας Κληρονομιάς της UNESCO;", "o": ["Η αρχαία Σαλαμίνα", "Το Αββαείο του Μπέλαπαϊς", "Ο Νεολιθικός Οικισμός της Χοιροκοιτίας", "Το αρχαίο Κούριον"], "ru": "Какой памятник в списке Всемирного наследия ЮНЕСКО?", "ro": [], "a": 2, "e": "Хирокития. Саламин и Беллапаис — на севере, Курион в список не входит. (Июль 2026 II.)"}, {"id": "13.9", "ch": 13, "q": "Η έδρα του Τεχνολογικού Πανεπιστημίου Κύπρου (ΤΕΠΑΚ) είναι η…", "o": ["Λευκωσία", "Λάρνακα", "Λεμεσός", "Πάφος"], "ru": "Главный кампус ТЕПАК находится в…", "ro": [], "a": 2, "e": "Лимассол. (Июль 2026 I.)"}, {"id": "13.10", "ch": 13, "q": "Το υπαίθριο Υδραγωγείο Καμάρων βρίσκεται στην επαρχία…", "o": ["Πάφου", "Λάρνακας", "Λεμεσού", "Λευκωσίας"], "ru": "Открытый акведук Камарес находится в районе…", "ro": [], "a": 1, "e": "Ларнака. (Июль 2026 II.)"}, {"id": "13.11", "ch": 13, "q": "Το ροδόνερο, που χρησιμοποιείται στην κυπριακή ζαχαροπλαστική, γίνεται από…", "o": ["κεράσια", "σταφύλια", "τριαντάφυλλα", "ρόδια"], "ru": "Розовая вода делается из…", "ro": [], "a": 2, "e": "Розы (τριαντάφυλλα). Ловушка: ρόδια — это гранаты. (Июль 2025.)"}, {"id": "13.12", "ch": 13, "q": "Ποια από τις ακόλουθες πληροφορίες σχετικά με τη ζωή και τον τουρισμό είναι λανθασμένη;", "o": ["Υπάρχουν οργανωμένες παραλίες προσβάσιμες σε τροχοκάθισμα.", "Υπάρχει οργανωμένος αγροτουρισμός.", "Για ενοικίαση τζετ σκι πρέπει να είναι κάποιος τουλάχιστον 18 ετών.", "Η είσοδος σε όλους τους αρχαιολογικούς χώρους είναι δωρεάν."], "ru": "Какое утверждение о жизни и туризме неверно?", "ro": ["Есть пляжи, доступные для колясок", "есть агротуризм", "гидроцикл — с 18 лет", "вход во все археологические памятники бесплатный"], "a": 3, "e": "Вход во все памятники бесплатным не является. (Июль 2026 II.)"}, {"id": "13.13", "ch": 13, "q": "Η Γαλάζια Σημαία στην Κύπρο…", "o": ["δηλώνει δάσος με μονοπάτια", "βρίσκεται έξω από αρχαιολογικούς χώρους", "είναι σήμα πιστοποίησης καθαρής παραλίας", "βρίσκεται στους δρόμους του κρασιού"], "ru": "«Голубой флаг» на Кипре…", "ro": [], "a": 2, "e": "Сертификат чистого пляжа. (Июль 2026 I.)"}, {"id": "13.14", "ch": 13, "q": "Ποιο από τα πιο κάτω ΔΕΝ είναι παραδοσιακό κυπριακό προϊόν;", "o": ["χαλλούμι", "αναρή", "φέτα", "κεφαλοτύρι"], "ru": "Что НЕ является традиционным кипрским продуктом?", "ro": [], "a": 2, "e": "Фета — греческий продукт. (Февраль 2025, в другом виде.)"}, {"id": "13.15", "ch": 13, "q": "Ποια ομάδα έχει κερδίσει τα περισσότερα πρωταθλήματα στην ιστορία του κυπριακού ποδοσφαίρου;", "o": ["ΑΠΟΕΛ", "Ομόνοια", "Ανόρθωση", "ΑΕΛ"], "ru": "Какой клуб выиграл больше всех чемпионатов Кипра по футболу?", "ro": [], "a": 0, "e": "АПОЭЛ. (Февраль 2024.)"}, {"id": "13.16", "ch": 13, "q": "Σε ποιο ξενοδοχείο των Πλατρών δημιουργήθηκε το κοκτέιλ Brandy Sour;", "o": ["Forest Park", "Ledra Palace", "Hilton", "Berengaria"], "ru": "В каком отеле в Платресе придумали коктейль Brandy Sour?", "ro": [], "a": 0, "e": "Forest Park. (Февраль 2025.)"}, {"id": "13.17", "ch": 13, "q": "Ποιο από τα ακόλουθα ΔΕΝ είναι στοιχείο της άυλης πολιτιστικής κληρονομιάς της UNESCO για την Κύπρο;", "o": ["Λευκαρίτικα", "Τσιαττιστά", "Κουμανδαρία", "Χαλλούμι"], "ru": "Что НЕ является элементом нематериального наследия ЮНЕСКО от Кипра?", "ro": [], "a": 3, "e": "Халлуми — защищённое наименование ЕС (ΠΟΠ), но не элемент нематериального наследия ЮНЕСКО. Ответы к главе 14"}, {"id": "14.1", "ch": 14, "q": "Ποια από τις ακόλουθες πληροφορίες, που σχετίζονται με οικονομικά θέματα της Κύπρου, είναι λανθασμένη;", "o": ["Το αρμόδιο υπουργείο για θέματα φορολογίας είναι το Υπουργείο Οικονομικών.", "Το αφορολόγητο εισόδημα είναι 25 000 ευρώ.", "Ο κατώτατος μισθός σήμερα είναι 1 088 ευρώ.", "Ο ΦΠΑ για τα νοικοκυριά στο ηλεκτρικό ρεύμα είναι 5%."], "ru": "Что неверно?", "ro": ["За налоги отвечает Минфин", "необлагаемый доход — 25 000 €", "минимальная зарплата — 1 088 €", "НДС на электричество для домохозяйств — 5%"], "a": 1, "e": "Необлагаемый доход — 22 000 €, а не 25 000 €. (Июль 2026 I.)"}, {"id": "14.2", "ch": 14, "q": "Από την 1η Μαΐου 2026 έως την 31η Μαρτίου 2027, ο ΦΠΑ στο ηλεκτρικό ρεύμα για τα νοικοκυριά είναι…", "o": ["19%", "9%", "15%", "5%"], "ru": "НДС на электричество для домохозяйств с 1.05.2026 по 31.03.2027 — …", "ro": [], "a": 3, "e": "5%. (Март 2026.)"}, {"id": "14.3", "ch": 14, "q": "Το αφορολόγητο εισόδημα, σε ευρώ, από το 2026 είναι…", "o": ["24 000", "25 000", "22 000", "20 000"], "ru": "Необлагаемый доход с 2026 года (в евро) — …", "ro": [], "a": 2, "e": "22 000. (Март 2026; набор «февраль 2024» приложения.)"}, {"id": "14.4", "ch": 14, "q": "Ποιο υπουργείο είναι αρμόδιο για το Τμήμα Φορολογίας;", "o": ["Εσωτερικών", "Άμυνας", "Οικονομικών", "Δικαιοσύνης"], "ru": "Какое министерство отвечает за Налоговый департамент?", "ro": [], "a": 2, "e": "Министерство финансов. (Июль 2025.)"}, {"id": "14.5", "ch": 14, "q": "Τους τελευταίους μήνες εμφανίστηκε σε πολλές κτηνοτροφικές μονάδες η νόσος…", "o": ["Πυρετός του Δυτικού Νείλου", "Σαλμονέλωση", "Ευλογιά των πιθήκων", "Αφθώδης πυρετός"], "ru": "В последние месяцы на многих животноводческих фермах появилась болезнь…", "ro": [], "a": 3, "e": "Ящур. (Июль 2026 II.)"}, {"id": "14.6", "ch": 14, "q": "Για να αντιμετωπίσει τη λειψυδρία, η Κυβέρνηση προμηθεύτηκε 14 κινητές μονάδες αφαλάτωσης από…", "o": ["τα Ηνωμένα Αραβικά Εμιράτα", "το Κατάρ", "τη Σαουδική Αραβία", "την Αίγυπτο"], "ru": "Для борьбы с нехваткой воды правительство получило 14 мобильных опреснителей из…", "ro": [], "a": 0, "e": "Объединённые Арабские Эмираты. (Июль 2025.)"}, {"id": "14.7", "ch": 14, "q": "Πότε η Κύπρος εντάχθηκε στη Ζώνη του Ευρώ;", "o": ["2004", "2007", "2008", "2010"], "ru": "Когда Кипр вошёл в еврозону?", "ro": [], "a": 2, "e": "2008 (1 января). (Февраль 2025.)"}, {"id": "14.8", "ch": 14, "q": "Ποιο είναι το μικρότερο χαρτονόμισμα του ευρώ;", "o": ["1 ευρώ", "2 ευρώ", "5 ευρώ", "10 ευρώ"], "ru": "Какая самая маленькая банкнота евро?", "ro": [], "a": 2, "e": "5 евро. Номиналы 1 и 2 евро — монеты. (Июль 2024.)"}, {"id": "14.9", "ch": 14, "q": "Οι Ευρωπαίοι και Κύπριοι αγρότες διαμαρτύρονται για τη συμφωνία Mercosur μεταξύ ΕΕ και χωρών της…", "o": ["Βόρειας Αμερικής", "Μέσης Ανατολής", "Νότιας Αμερικής", "Βόρειας Αφρικής"], "ru": "Фермеры протестуют против соглашения Mercosur между ЕС и странами…", "ro": [], "a": 2, "e": "Южной Америки. (Март 2026.)"}, {"id": "14.10", "ch": 14, "q": "Ποιος είναι ο εθνικός κατώτατος μισθός από το 2026 (μετά από 6 μήνες εργασίας);", "o": ["900 €", "1 000 €", "1 088 €", "1 200 €"], "ru": "Какова минимальная зарплата с 2026 года (после 6 месяцев работы)?", "ro": [], "a": 2, "e": "1 088 €. В первые 6 месяцев — 979 €."}, {"id": "14.11", "ch": 14, "q": "Ποιος είναι ο εταιρικός φόρος από το 2026;", "o": ["10%", "12,5%", "15%", "19%"], "ru": "Какова ставка налога на прибыль компаний с 2026 года?", "ro": [], "a": 2, "e": "15% (было 12,5%)."}, {"id": "14.12", "ch": 14, "q": "Τι απεικονίζεται στα κυπριακά κέρματα του 1, 2 και 5 σεντ;", "o": ["το Πλοίο της Κερύνειας", "το Είδωλο της Πομού", "το αγρινό", "ο χάρτης της Κύπρου"], "ru": "Что изображено на кипрских монетах 1, 2 и 5 центов?", "ro": [], "a": 2, "e": "Муфлон (αγρινό)."}, {"id": "14.13", "ch": 14, "q": "Ποιες χώρες θα συνδέσει το υποθαλάσσιο καλώδιο Great Sea Interconnector;", "o": ["Κύπρο, Ελλάδα, Ισραήλ", "Κύπρο, Αίγυπτο, Ιταλία", "Κύπρο, Τουρκία, Ελλάδα", "Κύπρο, Λίβανο, Γαλλία"], "ru": "Какие страны соединит подводный кабель Great Sea Interconnector?", "ro": [], "a": 0, "e": "Кипр, Греция, Израиль."}, {"id": "14.14", "ch": 14, "q": "Το κοίτασμα φυσικού αερίου «Pegasus-1» ανακαλύφθηκε το…", "o": ["2011", "2019", "2022", "2025"], "ru": "Газовое месторождение «Pegasus-1» открыто в…", "ro": [], "a": 3, "e": "2025 (8 июля)."}, {"id": "14.15", "ch": 14, "q": "Ποιος είναι ο κανονικός συντελεστής ΦΠΑ στην Κύπρο;", "o": ["5%", "9%", "19%", "24%"], "ru": "Какова стандартная ставка НДС на Кипре?", "ro": [], "a": 2, "e": "19%. Ставка 24% — греческая."}, {"id": "14.16", "ch": 14, "q": "Ποιος κλάδος συνεισφέρει περισσότερο στην κυπριακή οικονομία;", "o": ["γεωργία", "βιομηχανία", "υπηρεσίες (τουρισμός, ναυτιλία, χρηματοοικονομικά)", "εξόρυξη χαλκού"], "ru": "Какая отрасль больше всего вносит в экономику Кипра?", "ro": [], "a": 2, "e": "Услуги. Ответы к главе 15"}, {"id": "15.1", "ch": 15, "q": "Η είσοδος στην Κυπριακή Δημοκρατία είναι παράνομη από το λιμάνι της…", "o": ["Κερύνειας", "Λεμεσού", "Πάφου", "Λάρνακας"], "ru": "Въезд в Республику Кипр незаконен через порт…", "ro": [], "a": 0, "e": "Кирения, она находится на оккупированной территории. (Июль 2026 II.)"}, {"id": "15.2", "ch": 15, "q": "Ποιο από τα πιο κάτω έντυπα δεν εκδίδεται στα Κέντρα Εξυπηρέτησης του Πολίτη;", "o": ["Πιστοποιητικό γεννήσεως", "Κάρτα Νοσηλείας", "Πιστοποιητικό θανάτου", "Πιστοποιητικό IBAN"], "ru": "Какой документ НЕ выдаётся в ΚΕΠ?", "ro": [], "a": 3, "e": "Справку об IBAN выдаёт банк. (Июль 2026 I.)"}, {"id": "15.3", "ch": 15, "q": "Τι σημαίνουν τα αρχικά Ρ.Ι.Κ.;", "o": ["Ραδιοτηλεοπτικό Ίδρυμα Κύπρου", "Ραδιοφωνικό Ίδρυμα Κύπρου", "Ραδιοτηλεοπτικό Ινστιτούτο Κύπρου", "Ραδιοφωνικό Ινστιτούτο Κύπρου"], "ru": "Что означает аббревиатура Ρ.Ι.Κ.?", "ro": [], "a": 1, "e": "Ραδιοφωνικό Ίδρυμα Κύπρου. (Июль 2026 II, июль 2024, февраль 2024.)"}, {"id": "15.4", "ch": 15, "q": "Τι σημαίνει το ακρωνύμιο Α.ΤΗ.Κ.;", "o": ["Αρχή Τηλεόρασης Κύπρου", "Αρχή Τηλεπικοινωνιών Κύπρου", "Αρχή Τηλεφώνων Κύπρου", "Αρχή Τηλεθέασης Κύπρου"], "ru": "Что означает аббревиатура Α.ΤΗ.Κ.?", "ro": [], "a": 1, "e": "Αρχή Τηλεπικοινωνιών Κύπρου. (Июль 2026 I.)"}, {"id": "15.5", "ch": 15, "q": "Ποια από τις ακόλουθες πληροφορίες για το ΓεΣΥ είναι λανθασμένη;", "o": ["Η επίσκεψη στον προσωπικό γιατρό είναι δωρεάν", "Για κάθε επίσκεψη σε ειδικό γιατρό πληρώνει έξι ευρώ", "Οι αναγκαίες αναλύσεις αίματος είναι δωρεάν", "Για κάθε φάρμακο πληρώνει ένα ευρώ"], "ru": "Что неверно о ΓεΣΥ?", "ro": [], "a": 2, "e": "Анализы стоят по 1 € за каждый. (Март 2026.)"}, {"id": "15.6", "ch": 15, "q": "Ποια από τις ακόλουθες πληροφορίες είναι λανθασμένη;", "o": ["Το όριο ταχύτητας σε κατοικημένες περιοχές είναι 50 km/h", "Ο αριθμός έκτακτης ανάγκης για ασθενοφόρο είναι το 112", "Τα φαρμακεία είναι όλα ανοιχτά τις καθημερινές μέχρι τις 19:30", "Το όριο αλκοόλης στην αναπνοή είναι 22 μg/100 ml"], "ru": "Что неверно?", "ro": ["Скорость в населённых пунктах — 50 км/ч", "скорая — 112", "все аптеки по будням открыты до 19:30", "предел алкоголя — 22 мкг/100 мл"], "a": 2, "e": "Не все аптеки открыты до 19:30: в среду после обеда они закрыты, часы работы разные. (Июль 2026 I.)"}, {"id": "15.7", "ch": 15, "q": "Ποιο κανάλι τηλεόρασης είναι δημόσιο;", "o": ["ALPHA", "ANT1", "SIGMA", "ΡΙΚ 1"], "ru": "Какой телеканал государственный?", "ro": [], "a": 3, "e": "ΡΙΚ 1. (Июль 2025.)"}, {"id": "15.8", "ch": 15, "q": "Ταξιδιώτες από χώρες εκτός ΕΕ πρέπει να δηλώσουν αν μεταφέρουν τσιγάρα περισσότερα από…", "o": ["500", "50", "200", "800"], "ru": "Путешественники из-за пределов ЕС декларируют сигареты сверх…", "ro": [], "a": 2, "e": "200. (Июль 2025.)"}, {"id": "15.9", "ch": 15, "q": "Αν μεταφέρετε 10 000 ευρώ ή περισσότε
