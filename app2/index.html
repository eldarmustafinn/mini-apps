ρα, πρέπει να τα δηλώσετε.", "o": ["Σωστό", "Λάθος"], "ru": "Если везёте 10 000 евро и больше, их нужно задекларировать. Верно или неверно?", "ro": [], "a": 0, "e": "Верно. (Июль 2023, февраль 2025.)"}, {"id": "15.10", "ch": 15, "q": "Πόσα χρόνια διαρκεί η δημοτική εκπαίδευση;", "o": ["4", "5", "6", "9"], "ru": "Сколько лет длится начальная школа?", "ro": [], "a": 2, "e": "6 лет. (Июль 2024.)"}, {"id": "15.11", "ch": 15, "q": "Ποιο είναι το σύνηθες ωράριο των δημόσιων υπηρεσιών;", "o": ["7:30 – 15:00", "9:00 – 17:00", "8:00 – 13:00", "10:00 – 18:00"], "ru": "Каковы обычные часы работы госучреждений?", "ro": [], "a": 0, "e": "7:30–15:00."}, {"id": "15.12", "ch": 15, "q": "Ποιος είναι ο κωδικός τηλεφώνου της Κύπρου;", "o": ["+30", "+357", "+90", "+356"], "ru": "Каков телефонный код Кипра?", "ro": [], "a": 1, "e": "+357. Для сравнения: +30 — Греция, +90 — Турция, +356 — Мальта."}, {"id": "15.13", "ch": 15, "q": "Πού βρίσκεται η μοναδική ναυτική βάση της Κύπρου;", "o": ["Στη Λεμεσό", "Στο Μαρί (Λάρνακα)", "Στην Πάφο", "Στο Ακρωτήρι"], "ru": "Где находится единственная военно-морская база Кипра?", "ro": [], "a": 1, "e": "Мари, район Ларнаки (база «Эвангелос Флоракис»). (Февраль 2024.)"}, {"id": "15.14", "ch": 15, "q": "Πόσους μήνες υπηρετούν οι γυναίκες εθελόντριες στην Εθνική Φρουρά;", "o": ["3", "6", "14", "24"], "ru": "Сколько месяцев служат женщины-добровольцы в Национальной гвардии?", "ro": [], "a": 1, "e": "6 месяцев (ключ теста; по закону — от 6 до 14). Мужчины служат 14."}, {"id": "15.15", "ch": 15, "q": "Ποιο είναι το ελάχιστο διάστημα ισχύος διαβατηρίου για υπηκόους τρίτων χωρών;", "o": ["1 μήνας", "3 μήνες", "6 μήνες", "12 μήνες"], "ru": "Минимальный срок действия паспорта для граждан третьих стран?", "ro": [], "a": 2, "e": "6 месяцев (ключ теста; по официальной норме, насколько известно, — не менее 3 месяцев после выезда)."}, {"id": "15.16", "ch": 15, "q": "Σε ποια περιοχή της Κύπρου πέφτει η περισσότερη βροχή;", "o": ["Λευκωσία", "Λάρνακα", "Οροσειρά Τροόδου var CATS = [
  {id:'geo',  name:'Остров и география', ic:'🗺️', ch:[1,2,3]},
  {id:'hist', name:'Древняя и средневековая история', ic:'🏛️', ch:[5]},
  {id:'mod',  name:'Новейшая история и 1974 год', ic:'📜', ch:[6,7]},
  {id:'gov',  name:'Государство и политика', ic:'⚖️', ch:[8,9]},
  {id:'eu',   name:'Кипр в ЕС и в мире', ic:'🇪🇺', ch:[10]},
  {id:'rel',  name:'Религия и Церковь', ic:'⛪', ch:[11]},
  {id:'hol',  name:'Праздники и обычаи', ic:'🎉', ch:[12]},
  {id:'cul',  name:'Культура, кухня, наследие', ic:'🏺', ch:[13]},
  {id:'eco',  name:'Экономика и повседневная жизнь', ic:'💶', ch:[14,15,16]},
  {id:'now',  name:'Актуальные события 2025–2026', ic:'📰', ch:[17]},
  {id:'gap',  name:'Белые пятна', ic:'❓', ch:[18]}
];
var EXAM_DATE = new Date('2026-11-21T09:00:00+02:00');
var LETTERS = ['α','β','γ','δ'];
var KEY = 'cy-exam-v1';

var tg = window.Telegram && Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#f5efe3'); tg.setBackgroundColor('#f5efe3'); } catch(e) {}
function haptic(t){ try{ tg.HapticFeedback.notificationOccurred(t); }catch(e){} }

/* progress: {id: 1 = last answer correct, 0 = last answer wrong} */
var state = {p:{}, tr:true};
try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.p) state = s; } catch(e) {}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function qsFor(cat){ return BANK.qs.filter(function(q){ return cat.ch.indexOf(q.ch)>=0; }); }
function catOf(q){ for(var i=0;i<CATS.length;i++) if(CATS[i].ch.indexOf(q.ch)>=0) return CATS[i]; return null; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function $(id){ return document.getElementById(id); }
function show(id){ ['home','quiz','result'].forEach(function(s){ $(s).classList.toggle('hidden', s!==id); }); window.scrollTo(0,0);
  try{ if(id==='home') tg.BackButton.hide(); else tg.BackButton.show(); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function plural(n,a,b,c){ var m=n%10, h=n%100; if(m===1&&h!==11) return a; if(m>=2&&m<=4&&(h<12||h>14)) return b; return c; }

/* ---------- home ---------- */
function renderHome(){
  var days = Math.max(0, Math.ceil((EXAM_DATE - new Date())/86400000));
  $('days').textContent = days+' '+plural(days,'день','дня','дней');
  var total = BANK.qs.length, done = 0;
  BANK.qs.forEach(function(q){ if(state.p[q.id]===1) done++; });
  $('totalQ').textContent = total;
  var pct = Math.round(done/total*100);
  $('readyPct').textContent = pct+'%';
  $('readyBar').style.width = pct+'%';
  $('readyTxt').textContent = done+' из '+total+' верно';
  var mist = BANK.qs.filter(function(q){ return state.p[q.id]===0; }).length;
  $('mistCount').textContent = mist ? mist+' '+plural(mist,'вопрос','вопроса','вопросов') : 'пока нет';
  var html='';
  CATS.forEach(function(c){
    var list = qsFor(c), ok = list.filter(function(q){ return state.p[q.id]===1; }).length;
    var p = Math.round(ok/list.length*100), C = 2*Math.PI*15;
    html += '<button class="tile'+(p===100?' done':'')+'" data-cat="'+c.id+'">'+
      '<span class="em">'+c.ic+'</span>'+
      '<span class="rg"><svg width="38" height="38"><circle cx="19" cy="19" r="15" fill="none" stroke="#e4dccb" stroke-width="4"/>'+
      (p>0?'<circle cx="19" cy="19" r="15" fill="none" stroke="'+(p===100?'#5d7d36':'#c8702a')+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'"/>':'')+
      '</svg><span>'+p+'%</span></span>'+
      '<b>'+esc(c.name)+'</b><small>'+ok+' / '+list.length+'</small></button>';
  });
  $('cats').innerHTML = html;
}

/* ---------- quiz ---------- */
var run = null;
function startRun(title, list, exam){
  if(!list.length){ alert('Здесь пока нет вопросов.'); return; }
  run = {title:title, list:list, i:0, exam:!!exam, answers:[], picked:null, revealed:false, ends: exam ? Date.now()+45*60000 : 0};
  show('quiz'); renderQ();
  if(exam) tick();
}
function tick(){
  if(!run || !run.exam) return;
  var left = Math.max(0, run.ends - Date.now());
  var m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  $('qCount').innerHTML = '<span class="timer">'+m+':'+(s<10?'0':'')+s+'</span>';
  if(left<=0){ finish(); return; }
  setTimeout(tick, 500);
}
function renderQ(){
  var q = run.list[run.i];
  run.picked = null; run.revealed = false;
  var c = catOf(q);
  $('qTitle').textContent = run.exam ? 'Экзамен · вопрос '+(run.i+1)+' из '+run.list.length : (c ? c.name : run.title);
  if(!run.exam) $('qCount').textContent = (run.i+1)+' / '+run.list.length;
  $('qProg').style.width = (run.i/run.list.length*100)+'%';
  $('qText').textContent = q.q;
  $('qRu').textContent = q.ru;
  $('qRu').classList.toggle('hidden', !state.tr);
  $('trToggle').textContent = state.tr ? 'Скрыть перевод' : 'Показать перевод';
  var html='';
  q.o.forEach(function(o,k){
    var ru = (state.tr && q.ro && q.ro[k]) ? '<small>'+esc(q.ro[k])+'</small>' : '';
    html += '<button class="opt" data-k="'+k+'"><span class="l">'+LETTERS[k]+'</span><span class="t">'+esc(o)+ru+'</span></button>';
  });
  $('opts').innerHTML = html;
  $('expl').classList.add('hidden');
  $('next').textContent = 'Ответить'; $('next').disabled = true;
}
function pick(k){
  if(run.revealed) return;
  run.picked = k;
  [].forEach.call($('opts').children, function(b,i){ b.classList.toggle('sel', i===k); });
  $('next').disabled = false;
  if(run.exam) $('next').textContent = run.i===run.list.length-1 ? 'Завершить' : 'Дальше';
}
function onNext(){
  var q = run.list[run.i];
  if(run.exam){
    run.answers.push(run.picked);
    record(q, run.picked===q.a);
    advance(); return;
  }
  if(!run.revealed){
    run.revealed = true;
    var ok = run.picked===q.a;
    run.answers.push(run.picked);
    record(q, ok); haptic(ok?'success':'error');
    [].forEach.call($('opts').children, function(b,i){
      b.classList.remove('sel');
      if(i===q.a) b.classList.add('ok'); else if(i===run.picked) b.classList.add('bad');
    });
    $('expl').innerHTML = '<b style="color:'+(ok?'var(--olive)':'var(--red)')+'">'+(ok?'Верно!':'Неверно. Правильный ответ: '+LETTERS[q.a])+'</b>'+esc(q.e);
    $('expl').classList.remove('hidden');
    $('next').textContent = run.i===run.list.length-1 ? 'Результат' : 'Следующий вопрос';
    return;
  }
  advance();
}
function advance(){ run.i++; if(run.i>=run.list.length) finish(); else { renderQ(); window.scrollTo(0,0); } }
function record(q, ok){ state.p[q.id] = ok?1:0; save(); }

function finish(){
  var r = run; run.exam = false;
  var right = 0; r.answers.forEach(function(a,i){ if(a===r.list[i].a) right++; });
  var n = r.list.length;
  $('resScore').textContent = right+' / '+n;
  if(r.title==='Пробный экзамен'){
    $('resVerdict').textContent = right>=15 ? 'Сдано: гражданство и ПМЖ' : right>=13 ? 'Сдано для ПМЖ (для гражданства нужно 15)' : 'Пока не сдано';
    $('resEmoji').textContent = right>=15 ? '🏆' : right>=13 ? '👍' : '📚';
    $('resNote').textContent = 'Проходной балл: 13 для ПМЖ, 15 для гражданства.';
  } else {
    var p = Math.round(right/n*100);
    $('resVerdict').textContent = p>=80 ? 'Отлично!' : p>=50 ? 'Хороший результат' : 'Есть над чем поработать';
    $('resEmoji').textContent = p>=80 ? '🌟' : p>=50 ? '💪' : '📚';
    $('resNote').textContent = 'Ошибки сохранены в разделе «Ошибки».';
  }
  var html = '';
  r.list.forEach(function(q,i){
    var a = r.answers[i]; if(a===q.a) return;
    html += '<div class="rv"><div><b>'+esc(q.q)+'</b></div><div class="m">'+esc(q.ru)+'</div>'+
      (a!=null ? '<div class="r">✗ '+LETTERS[a]+') '+esc(q.o[a])+'</div>' : '<div class="r">✗ нет ответа</div>')+
      '<div class="g">✓ '+LETTERS[q.a]+') '+esc(q.o[q.a])+'</div><div class="m" style="margin-top:4px">'+esc(q.e)+'</div></div>';
  });
  $('review').innerHTML = html ? '<h2 class="serif">Разбор ошибок</h2>'+html : '';
  run = null;
  show('result');
}

/* exam: 25 questions spread across topics like the real exam */
function buildExam(){
  var plan = [[ [1,2,3],5 ],[ [5,6,7],3 ],[ [8,9,10],5 ],[ [11,12,13],4 ],[ [14,15,16],5 ],[ [17,18],3 ]];
  var out = [];
  plan.forEach(function(p){ out = out.concat(shuffle(BANK.qs.filter(function(q){ return p[0].indexOf(q.ch)>=0; })).slice(0,p[1])); });
  return out;
}

/* ---------- events ---------- */
$('cats').addEventListener('click', function(e){
  var b = e.target.closest('.tile'); if(!b) return;
  var c = CATS.filter(function(x){ return x.id===b.dataset.cat; })[0];
  var list = qsFor(c);
  var todo = shuffle(list.filter(function(q){ return state.p[q.id]!==1; }));
  var rest = shuffle(list.filter(function(q){ return state.p[q.id]===1; }));
  startRun(c.name, todo.concat(rest).slice(0, 15));
});
$('startAll').onclick = function(){
  var todo = shuffle(BANK.qs.filter(function(q){ return state.p[q.id]!==1; }));
  var rest = shuffle(BANK.qs.filter(function(q){ return state.p[q.id]===1; }));
  startRun('Тренировка', todo.concat(rest).slice(0,15));
};
$('startExam').onclick = function(){ startRun('Пробный экзамен', buildExam(), true); };
$('startMist').onclick = function(){
  var l = BANK.qs.filter(function(q){ return state.p[q.id]===0; });
  if(!l.length){ alert('Ошибок пока нет. Отличная работа!'); return; }
  startRun('Мои ошибки', shuffle(l));
};
$('opts').addEventListener('click', function(e){ var b=e.target.closest('.opt'); if(b) pick(+b.dataset.k); });
$('next').onclick = onNext;
$('trToggle').onclick = function(){
  state.tr = !state.tr; save();
  if(run.revealed){
    $('qRu').classList.toggle('hidden', !state.tr);
    $('trToggle').textContent = state.tr ? 'Скрыть перевод' : 'Показать перевод';
    return;
  }
  var picked = run.picked; renderQ(); if(picked!==null) pick(picked);
};
function goHome(){ run=null; renderHome(); show('home'); }
$('quit').onclick = function(){ if(!run || run.i===0 || confirm('Выйти? Прогресс по отвеченным вопросам сохранён.')) goHome(); };
$('resHome').onclick = goHome;
$('resetBtn').onclick = function(){ if(confirm('Сбросить весь прогресс?')){ state.p={}; save(); renderHome(); } };
try{ tg.BackButton.onClick(function(){ $('quit').onclick(); }); }catch(e){}

renderHome();
</script>
</body>
