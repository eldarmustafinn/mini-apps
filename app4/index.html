<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<title>Anna's Library</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1424; --card:#14223a; --line:#22314d; --chip:#1b2840;
    --text:#f3f5fa; --muted:#9aa7bf; --gold:#f7c23b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center}
  button{font:inherit;color:inherit}
  .app{width:100%;max-width:520px;min-height:100vh;position:relative;
       background:radial-gradient(120% 50% at 50% 0%,#13223d 0%,var(--bg) 60%)}
  .screen{display:none;padding:20px 16px 110px;animation:fade .25s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:46px;height:46px;flex:none}
  .brand h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .brand h1 span{color:var(--gold)}
  .brand p{font-size:13px;color:var(--muted);margin-top:4px}
  .icons{display:flex;gap:10px}
  .icon-btn{width:44px;height:44px;border-radius:50%;background:var(--chip);border:none;display:grid;place-items:center;cursor:pointer}
  .icon-btn svg{width:20px;height:20px}

  /* Hero */
  .hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:190px;padding:24px 22px;
        background:linear-gradient(90deg,#0d1729 0%,#0d1729 38%,rgba(13,23,41,.2) 75%),
                   radial-gradient(70% 90% at 85% 40%,#7a4a1c 0%,#3a2412 45%,#0d1729 85%)}
  .hero .kicker{font-size:11px;letter-spacing:2.5px;font-weight:600;color:#dfe5ef}
  .hero h2{font-size:34px;font-weight:800;line-height:1.05;margin:6px 0 10px;max-width:60%}
  .hero p{font-size:13.5px;color:#d6dceb;max-width:55%;line-height:1.4}
  .hero .btn{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1a1a1a;
             font-weight:700;font-size:15px;padding:11px 22px;border-radius:999px;border:none;cursor:pointer}
  .hero .art{position:absolute;right:-6px;bottom:-4px;width:52%;max-width:240px}

  /* Grid */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px}
  .sec-head h3{font-size:22px;font-weight:700}
  .pill{font-size:13px;font-weight:600;background:var(--chip);padding:6px 12px;border-radius:999px;color:#dfe5ef}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media (max-width:430px){.grid{grid-template-columns:repeat(3,1fr)}}
  .book{position:relative;border:none;border-radius:12px;overflow:hidden;background:var(--c);text-align:center;
        box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;cursor:pointer;
        transition:transform .15s ease;animation:fade .35s ease both}
  .book:active{transform:scale(.97)}
  .cover{aspect-ratio:3/4.1;position:relative;padding:10px 6px;
         background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(0,0,0,.35)),var(--c);
         display:flex;flex-direction:column;align-items:center;justify-content:center}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--c);
         border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800;font-size:14px;z-index:2;
         box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .empty-icon{width:34px;height:34px;opacity:.55;margin-bottom:6px}
  .empty-txt{font-size:10.5px;color:rgba(255,255,255,.72);font-weight:500;line-height:1.25}
  .title{font-family:'Libre Baskerville',serif;font-size:12px;font-weight:700;line-height:1.2;position:relative;z-index:1}
  .author{font-size:9.5px;opacity:.85;margin-top:4px;position:relative;z-index:1}
  .meta{display:flex;align-items:center;justify-content:space-between;padding:7px 7px 8px;background:rgba(0,0,0,.18)}
  .dur{display:flex;align-items:center;gap:4px;font-size:10.5px;color:rgba(255,255,255,.85)}
  .dur svg{width:12px;height:12px}
  .play{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .play svg{width:9px;height:9px;fill:var(--c)}
  .book.is-empty .play{opacity:.35}

  /* Reader */
  .rtop{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
  .rcount{font-size:13px;color:var(--muted);font-weight:600}
  .rcover{width:150px;aspect-ratio:3/4.1;margin:0 auto 18px;border-radius:14px;overflow:hidden;position:relative;
          background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(0,0,0,.35)),var(--c);
          box-shadow:0 14px 34px rgba(0,0,0,.45);display:grid;place-items:center}
  .rcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .rcover svg{width:54px;height:54px;opacity:.55}
  .rtitle{font-family:'Libre Baskerville',serif;font-size:24px;text-align:center;line-height:1.25}
  .rauthor{text-align:center;color:var(--muted);margin-top:6px;font-size:14px}
  .player{margin:20px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;
          display:flex;align-items:center;gap:14px}
  .pbtn{width:52px;height:52px;border-radius:50%;border:none;background:var(--gold);display:grid;place-items:center;cursor:pointer;flex:none}
  .pbtn svg{width:22px;height:22px;fill:#1a1a1a}
  .pbtn:disabled{opacity:.35;cursor:default}
  .ptrack{flex:1;min-width:0}
  .pbar{height:6px;border-radius:6px;background:#26365a;overflow:hidden;cursor:pointer}
  .pbar i{display:block;height:100%;width:0;background:var(--gold)}
  .pnote{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
  .rtext{font-size:17px;line-height:1.75;color:#dde3ee}
  .rtext p{margin-bottom:1em}
  .rtext em{color:var(--gold);font-style:italic}
  .soon{text-align:center;color:var(--muted);padding:24px 10px;border:1px dashed var(--line);border-radius:16px}
  .next{width:100%;margin-top:20px;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:16px;
        background:var(--chip);cursor:pointer}

  /* Bottom nav */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:10;
      background:rgba(11,20,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      display:flex;justify-content:space-around;padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
  nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-decoration:none;font-weight:500;position:relative}
  nav a svg{width:24px;height:24px}
  nav a.active{color:var(--gold)}
  nav a.active::after{content:"";position:absolute;bottom:-7px;width:28px;height:3px;border-radius:3px;background:var(--gold)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:20;
         background:var(--chip);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;
         transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="screen active" id="home">
    <header>
      <div class="brand">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M8 28v-4a16 16 0 0 1 32 0v4" stroke="#f7c23b" stroke-width="4" stroke-linecap="round"/>
          <rect x="5" y="26" width="9" height="15" rx="4" fill="#f7c23b"/><rect x="34" y="26" width="9" height="15" rx="4" fill="#f7c23b"/>
        </svg>
        <div><h1>Anna's <span>Library</span></h1><p>Great stories. Anytime. Anywhere.</p></div>
      </div>
      <div class="icons">
        <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="icon-btn" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
      </div>
    </header>

    <div class="hero">
      <div class="kicker">YOUR NEXT CHAPTER</div>
      <h2>Starts Here</h2>
      <p>Choose a book and dive into a world of amazing stories.</p>
      <button class="btn" id="exploreBtn">Explore
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <svg class="art" viewBox="0 0 240 170" aria-hidden="true">
        <rect x="10" y="128" width="170" height="26" rx="3" fill="#24324f"/><rect x="10" y="128" width="170" height="5" fill="#f2e3c2"/>
        <rect x="22" y="104" width="150" height="24" rx="3" fill="#8f2230"/><rect x="22" y="104" width="150" height="4" fill="#f2e3c2"/>
        <rect x="34" y="82" width="128" height="22" rx="3" fill="#b24a2c"/><rect x="34" y="82" width="128" height="4" fill="#f2e3c2"/>
        <path d="M130 120 a45 45 0 0 1 90 0" stroke="#15161b" stroke-width="10" fill="none" stroke-linecap="round"/>
        <ellipse cx="135" cy="128" rx="17" ry="24" fill="#1d1f26"/><ellipse cx="135" cy="128" rx="10" ry="16" fill="#2c2f38"/>
        <ellipse cx="215" cy="128" rx="17" ry="24" fill="#1d1f26"/><ellipse cx="215" cy="128" rx="10" ry="16" fill="#2c2f38"/>
      </svg>
    </div>

    <div class="sec-head" id="books"><h3>Choose a Book</h3><span class="pill" id="range">1 – 10</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- READER -->
  <section class="screen" id="reader">
    <div class="rtop">
      <button class="icon-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <span class="rcount" id="rCount"></span>
      <span style="width:44px"></span>
    </div>
    <div class="rcover" id="rCover"></div>
    <div class="rtitle" id="rTitle"></div>
    <div class="rauthor" id="rAuthor"></div>
    <div class="player">
      <button class="pbtn" id="playBtn" disabled aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <div class="ptrack">
        <div class="pbar" id="pbar"><i id="prog"></i></div>
        <div class="pnote"><span id="pCur">0:00</span><span id="pNote">Audio coming soon</span></div>
      </div>
    </div>
    <div class="rtext" id="rText"></div>
    <button class="next" id="nextBtn"></button>
  </section>

</div>

<audio id="audio" preload="none"></audio>
<div class="toast" id="toast">Book coming soon ✨</div>

<nav>
  <a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home</a>
  <a href="#" class="active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5c3-1 6-1 8 1v14c-2-2-5-2-8-1zM21 5c-3-1-6-1-8 1v14c2-2 5-2 8-1z"/></svg>Books</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg>My Library</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Favorites</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
</nav>

<script src="books.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtText = s => esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const audioSrc = i => `audio/${String(i+1).padStart(2,'0')}.mp3`;
const time = s => { if(!isFinite(s)) return ''; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(s%60).padStart(2,'0')}`; };
const BOOK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M4 5c3-1 6-1 8 1v14c-2-2-5-2-8-1zM20 5c-3-1-6-1-8 1v14c2-2 5-2 8-1z"/></svg>';
const HP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>';

/* Telegram */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData !== undefined) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0b1424'); tg.setBackgroundColor && tg.setBackgroundColor('#0b1424'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){} }

/* Grid */
$('range').textContent = `1 – ${BOOKS.length}`;
$('grid').innerHTML = BOOKS.map((b,i)=>{
  const empty = !b.title;
  return `<button class="book${empty?' is-empty':''}" data-i="${i}" style="--c:${b.color};animation-delay:${i*45}ms">
    <div class="cover">
      <span class="badge">${i+1}</span>
      ${b.cover ? `<img src="${esc(b.cover)}" alt="">` : ''}
      ${empty ? `<span class="empty-icon">${BOOK_ICON}</span><span class="empty-txt">Coming<br>soon</span>`
              : (b.cover ? '' : `<span class="title">${esc(b.title)}</span><span class="author">${esc(b.author)}</span>`)}
    </div>
    <div class="meta"><span class="dur">${HP}<span id="d${i}">--</span></span>
      <span class="play"><svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg></span></div>
  </button>`;}).join('');
document.querySelectorAll('.book').forEach(c=>c.addEventListener('click',()=>openBook(+c.dataset.i)));
$('exploreBtn').onclick = ()=> $('books').scrollIntoView({behavior:'smooth'});

/* Durations for filled books */
BOOKS.forEach((b,i)=>{ if(!b.title) return; const a=new Audio(); a.preload='metadata';
  a.onloadedmetadata=()=>{ $('d'+i).textContent=time(a.duration); }; a.src=audioSrc(i); });

/* Reader */
let current = 0; const audio = $('audio');
function openBook(i){
  const b = BOOKS[i];
  if(!b.title) return toast();
  current = i;
  document.documentElement.style.setProperty('--c', b.color);
  $('rCount').textContent = `Book ${i+1} of ${BOOKS.length}`;
  $('rCover').style.setProperty('--c', b.color);
  $('rCover').innerHTML = b.cover ? `<img src="${esc(b.cover)}" alt="">` : BOOK_ICON;
  $('rTitle').textContent = b.title;
  $('rAuthor').textContent = b.author || '';
  $('rText').innerHTML = b.text && b.text.trim()
    ? b.text.split(/\n\s*\n/).map(p=>`<p>${fmtText(p.trim())}</p>`).join('')
    : `<div class="soon">Text coming soon</div>`;
  const nxt = BOOKS.findIndex((x,k)=>k>i && x.title);
  $('nextBtn').textContent = nxt>-1 ? 'Next book →' : 'Back to library';
  $('nextBtn').dataset.next = nxt;
  setupAudio(i); show('reader');
}
function setupAudio(i){
  audio.pause(); setIcon(false); $('prog').style.width='0'; $('pCur').textContent='0:00';
  $('pNote').textContent='Audio coming soon'; $('playBtn').disabled = true;
  audio.src = audioSrc(i); audio.load();
}
audio.addEventListener('loadedmetadata',()=>{ $('playBtn').disabled=false; $('pNote').textContent=time(audio.duration); });
audio.addEventListener('error',()=>{ $('playBtn').disabled=true; $('pNote').textContent='Audio coming soon'; });
audio.addEventListener('timeupdate',()=>{ if(!audio.duration) return;
  $('prog').style.width=(audio.currentTime/audio.duration*100)+'%';
  $('pCur').textContent=time(audio.currentTime); $('pNote').textContent='-'+time(audio.duration-audio.currentTime); });
audio.addEventListener('ended',()=>setIcon(false));
$('playBtn').onclick = ()=>{ if(audio.paused){ audio.play(); setIcon(true);} else { audio.pause(); setIcon(false);} };
$('pbar').onclick = e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; };
function setIcon(p){ $('playIcon').innerHTML = p ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }

$('nextBtn').onclick = ()=>{ const n=+$('nextBtn').dataset.next; n>-1 ? openBook(n) : goHome(); };
$('backBtn').onclick = goHome;
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  window.scrollTo(0,0);
  if(tg && tg.BackButton){ try{ id==='reader' ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){} }
}
function goHome(){ audio.pause(); setIcon(false); show('home'); }
if(tg && tg.BackButton){ try{ tg.BackButton.onClick(goHome); }catch(e){} }

let tt; function toast(){ const el=$('toast'); el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1600); }
</script>
</body>
</html>
