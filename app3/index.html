<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Emily Bookshelf</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#2f8ff0; --sky-mid:#7cc4fb; --sky-bot:#d8f0ff;
    --grass:#6fcf4a; --grass-dark:#3fae36;
    --white:#ffffff; --ink:#24324a; --yellow:#ffd93b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-bot) 75%,#bff0a8 100%);
    min-height:100vh;overflow-x:hidden;
  }
  .screen{display:none;min-height:100vh;position:relative}
  .screen.active{display:block}

  /* ---------- decor ---------- */
  .cloud{position:absolute;background:#fff;border-radius:100px;opacity:.85;z-index:0}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:120px;height:38px;top:120px;left:-30px}
  .c1::before{width:60px;height:60px;top:-30px;left:20px}.c1::after{width:46px;height:46px;top:-20px;left:62px}
  .c2{width:150px;height:44px;top:200px;right:-50px}
  .c2::before{width:70px;height:70px;top:-36px;left:30px}.c2::after{width:52px;height:52px;top:-24px;left:84px}
  .star{position:absolute;color:var(--yellow);font-size:26px;z-index:1;animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);opacity:.7}}
  .hills{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:0;pointer-events:none}
  .hills::before,.hills::after{content:"";position:absolute;border-radius:50% 50% 0 0;bottom:-60px}
  .hills::before{left:-20%;width:90%;height:190px;background:var(--grass)}
  .hills::after{right:-25%;width:95%;height:170px;background:var(--grass-dark)}

  /* ---------- header ---------- */
  header{position:relative;z-index:2;text-align:center;padding:calc(env(safe-area-inset-top) + 28px) 16px 18px}
  h1{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(38px,11vw,64px);line-height:1;
    color:#fff;text-shadow:0 4px 0 #1f6fc4,0 8px 18px rgba(0,40,100,.35);letter-spacing:.5px
  }
  h1 span{color:var(--yellow)}
  .subtitle{margin-top:12px;font-weight:800;font-size:17px;color:#fff;text-shadow:0 2px 6px rgba(0,50,120,.35)}
  .subtitle::before,.subtitle::after{content:"✦";color:var(--yellow);margin:0 8px}

  /* ---------- grid ---------- */
  .grid{
    position:relative;z-index:2;display:grid;gap:14px;
    grid-template-columns:repeat(2,1fr);padding:8px 16px calc(env(safe-area-inset-bottom) + 130px);
    max-width:900px;margin:0 auto
  }
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{
    position:relative;background:#fff;border-radius:24px;padding:5px;border:none;cursor:pointer;text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 22px rgba(20,70,140,.22);
    transition:transform .15s ease;font-family:inherit;animation:pop .45s backwards
  }
  .card:active{transform:scale(.95)}
  @keyframes pop{from{transform:translateY(20px) scale(.9);opacity:0}}
  .art{height:120px;border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:center;font-size:62px;overflow:hidden;position:relative}
  .art .emoji{filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .label{
    border-radius:0 0 20px 20px;color:#fff;padding:9px 6px 8px;min-height:84px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px
  }
  .label b{font-weight:900;font-size:14.5px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.2)}
  .label svg{width:22px;height:22px}
  .num{
    position:absolute;top:-6px;left:-6px;width:40px;height:40px;border-radius:50%;
    background:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:2
  }
  .num i{font-style:normal;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}

  /* ---------- reader ---------- */
  #reader{background:linear-gradient(180deg,#1d3b7a 0%,#2c5aa8 30%,#fdf8ef 30.1%)}
  .r-top{position:relative;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;align-items:center;gap:12px;z-index:2}
  .back{
    width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#2f6fd0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2);flex-shrink:0
  }
  .r-top .count{color:#cfe2ff;font-weight:800;font-size:14px}
  .hero{max-width:640px;margin:14px auto 0;padding:0 16px}
  .hero-art{height:170px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:96px;box-shadow:0 10px 26px rgba(0,0,0,.25);border:5px solid #fff}
  .hero h2{font-family:'Nunito';font-weight:900;font-size:26px;line-height:1.2;margin:20px 0 12px;color:var(--ink)}
  .player{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;
    box-shadow:0 4px 14px rgba(40,60,110,.12);margin-bottom:22px
  }
  .play{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .play:disabled{opacity:.45;cursor:default}
  .bar{flex:1;height:8px;background:#e7ecf5;border-radius:8px;overflow:hidden}
  .bar div{height:100%;width:0;border-radius:8px}
  .p-note{font-size:13px;color:#7a869c;font-weight:800;white-space:nowrap}
  .story{max-width:640px;margin:0 auto;padding:0 20px}
  .story p{font-size:19px;line-height:1.65;margin-bottom:14px;font-weight:600}
  .story em{color:#6a5acd}
  .next{
    display:block;width:calc(100% - 40px);max-width:600px;margin:26px auto calc(env(safe-area-inset-bottom) + 30px);
    border:none;border-radius:20px;padding:16px;color:#fff;font-family:inherit;font-weight:900;font-size:17px;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.15)
  }
  .end{text-align:center;font-size:28px;margin:10px 0 0}
</style>
</head>
<body>

<!-- ===== MAIN ===== -->
<section id="home" class="screen active">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <span class="star" style="top:70px;right:22px">★</span>
  <span class="star" style="top:46px;left:24px;font-size:18px;animation-delay:1s">★</span>
  <header>
    <h1>Emily <span>Bookshelf</span></h1>
    <p class="subtitle">Выбери сказку и слушай!</p>
  </header>
  <div class="grid" id="grid"></div>
  <div class="hills"></div>
</section>

<!-- ===== READER ===== -->
<section id="reader" class="screen">
  <div class="r-top">
    <button class="back" id="backBtn" aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="count" id="rCount"></span>
  </div>
  <div class="hero">
    <div class="hero-art" id="rArt"></div>
    <h2 id="rTitle"></h2>
    <div class="player">
      <button class="play" id="playBtn" aria-label="Слушать">
        <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>
      </button>
      <div class="bar"><div id="prog"></div></div>
      <span class="p-note" id="pNote">Аудио скоро</span>
    </div>
  </div>
  <article class="story" id="rText"></article>
  <div class="end">🌙✨</div>
  <button class="next" id="nextBtn">Следующая сказка →</button>
  <audio id="audio" preload="none"></audio>
</section>

<script>
const HEADPHONES = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="2" fill="#fff"/><rect x="16.5" y="14" width="4.5" height="7" rx="2" fill="#fff"/></svg>';

const BOOKS = [
{ title:"Ёжик и потерянная звёздочка", emoji:"🦔", color:"#2f80ed", bg:"linear-gradient(180deg,#1f3c88,#4b6fd6 60%,#4caf50 60%)",
text:`На краю тихого леса, под старой ёлкой, жил ёжик Тимоша. У него был маленький домик из сухих листьев, мягкий мох вместо подушки и круглое окошко, из которого было видно небо.

Каждый вечер Тимоша садился у окошка и считал звёзды. Одна, две, три… Он знал их все. А самую маленькую, которая мигала над верхушкой ёлки, он называл Искоркой.

Однажды вечером Тимоша выглянул в окошко — а Искорки нет. Все звёзды на месте, а её нет.

— Куда же она подевалась? — прошептал ёжик.

И тут в траве у ёлки что-то тихонько засветилось. Тимоша выбежал из домика, раздвинул травинки носом… А там сидела крошечная звёздочка. Она была совсем-совсем маленькая и немножко дрожала.

— Я упала, — сказала звёздочка тонким голоском. — Я играла с ветром и упала. А теперь не знаю, как вернуться домой.

— Не плачь, — сказал Тимоша. — Я тебе помогу.

Он осторожно посадил звёздочку себе на спинку, между иголками, чтобы она не упала, и пошёл к самому высокому месту в лесу — к холму, где росла старая сосна.

По дороге им встретилась белка.

— Куда ты идёшь так поздно, Тимоша?

— Несу звёздочку домой, на небо.

— Я знаю короткую дорогу, — сказала белка и побежала впереди, показывая путь.

Потом им встретилась сова.

— Я посвечу вам глазами, — сказала сова, — чтобы вы не споткнулись.

И вот они поднялись на холм. Сосна была такая высокая, что её макушка почти касалась неба. Белка взяла звёздочку в лапки, быстро-быстро забралась на самую верхушку — и подбросила её вверх.

Звёздочка взлетела… выше… ещё выше… и засияла на своём месте, над ёлкой Тимоши.

— Спасибо! — донеслось с неба тихим звоном.

Тимоша вернулся домой. Он забрался под мягкий мох, свернулся клубочком и посмотрел в окошко. Искорка мигала ему: раз, два, три. Это значило — *спокойной ночи, друг*.

Тимоша улыбнулся, закрыл глазки… и уснул.

И ты закрывай глазки. Искорка светит и тебе… Спокойной ночи.`},

{ title:"Облачко, которое боялось дождя", emoji:"☁️", color:"#1fa65a", bg:"linear-gradient(180deg,#8fd3ff,#c8ecff 65%,#7ed957 65%)",
text:`Высоко-высоко в небе жило маленькое белое облачко. Звали его Пушинка. Оно было лёгкое, как пёрышко, и мягкое, как вата.

Пушинка любила летать над полями и смотреть вниз. Там бегали дети, паслись коровы, качались цветы. А вечером Пушинка становилась розовой от заката и казалась самой красивой на свете.

Но у Пушинки был один секрет. Она очень боялась дождя.

Все облака вокруг иногда становились тяжёлыми и серыми, а потом — кап-кап-кап — проливались дождём. И снова становились лёгкими и белыми.

— А вдруг я пролью весь дождик и исчезну? — шептала Пушинка. — Вдруг от меня ничего не останется?

И она старалась не думать о дожде.

Но однажды Пушинка пролетала над маленьким садом. Там жила девочка, которая посадила цветы. Цветы стояли, опустив головки. Земля была сухая-сухая. Девочка гладила листики и грустно говорила:

— Пейте, мои хорошие… только воды больше нет.

Пушинка почувствовала, как внутри неё становится тяжело и тепло. Это собирались капельки.

— Мне страшно, — сказала Пушинка большому старому облаку, которое плыло рядом.

— Я знаю, — ответило старое облако мягким голосом. — Мне тоже было страшно в первый раз. Но послушай: дождь — это не значит исчезнуть. Дождь — это подарок. Ты отдаёшь капельки, а они возвращаются к тебе туманом, росой и речкой. Ты никогда не пропадёшь.

Пушинка вздохнула… и отпустила первую капельку. Кап. Потом вторую. Кап-кап. А потом пошёл тихий, тёплый, ласковый дождик.

Цветы подняли головки. Листики заблестели. Девочка подставила ладошки и засмеялась.

А Пушинка… не исчезла. Она стала лёгкой-лёгкой, ещё легче, чем раньше. И ей было очень хорошо.

Вечером над садом зажглась радуга. А Пушинка, маленькая и белая, улеглась на край неба, как на подушку, и тихо задремала.

Внизу девочка тоже ложилась спать. Она посмотрела в окно и сказала: *«Спасибо, облачко»*.

Пушинка улыбнулась во сне.

Спи и ты, моя хорошая. Ничего не бойся… Спокойной ночи.`},

{ title:"Как Луна укладывала море", emoji:"🌕", color:"#7b4fd6", bg:"linear-gradient(180deg,#24245e,#4a3c9a 58%,#2b7bd0 58%)",
text:`Когда солнце уходит спать за край земли, на небо поднимается Луна. Она большая, круглая и серебристая. И у неё есть очень важная работа — укладывать спать море.

А море вечером совсем не хочет спать. Волны шумят, бегают по берегу, брызгаются и смеются:

— Ещё чуть-чуть! Мы ещё поиграем!

Луна не сердится. Она никогда не сердится. Она тихонько опускает на воду свою серебряную дорожку — длинную-длинную, от самого горизонта до берега.

— Сначала уложим рыбок, — говорит Луна.

И маленькие рыбки, серебристые и полосатые, прячутся в мягкие водоросли. Водоросли качаются, как колыбельки. Туда-сюда… туда-сюда…

— Теперь уложим крабиков, — говорит Луна.

Крабики закапываются в тёплый песок. Только глазки торчат. Потом и глазки закрываются.

— Теперь медуз, — говорит Луна.

Медузы опускаются глубоко-глубоко, туда, где тихо и темно, и светятся там, как маленькие ночники.

— А теперь — дельфинов.

Дельфины ещё немножко прыгают, делают последнее «плюх!» и засыпают прямо на воде, покачиваясь на волнах.

Остались только волны. Они ещё бегают, но уже медленнее.

Луна наклоняется к ним низко-низко и шепчет:

*— Ш-ш-ш…*

И волны отвечают ей:

*— Ш-ш-ш…*

Они становятся всё меньше, всё тише. Они уже не бегут, а только гладят песок. Вперёд… и назад. Вперёд… и назад.

И вот уже всё море дышит медленно и спокойно, как спящий ребёнок. Вдох… и выдох. Вдох… и выдох.

Луна смотрит на море и улыбается. Работа сделана. Теперь она будет светить всю ночь, чтобы никому не было страшно.

А если ты прислушаешься, ты тоже услышишь, как дышит море. Вдох… и выдох.

Дыши вместе с ним. Вдох… и выдох.

Луна светит и тебе. Спокойной ночи.`},

{ title:"Маленький кит ищет колыбельную", emoji:"🐳", color:"#f57c1f", bg:"linear-gradient(180deg,#9ee0ff,#5bb8f0 50%,#1e78c8 50%)",
text:`В большом синем океане жил китёнок Бу. Он был ещё маленький — всего лишь размером с автобус. Для кита это совсем крошка.

Каждый вечер мама-кит пела ему колыбельную. Её песня была низкая и тёплая, она летела далеко-далеко по воде, и китёнок засыпал.

Но однажды вечером Бу заигрался с рыбками и уплыл далеко от мамы. Стало темно. Пора спать. А колыбельной нет.

— Мне нужна колыбельная, — сказал Бу. — Без неё я не усну.

И он поплыл искать.

Сначала он встретил черепаху.

— Черепаха, спой мне колыбельную!

Черепаха подумала и запела медленно-медленно: *«Спи… малыш… спи…»* Песня была хорошая, но очень уж медленная. Бу зевнул, но не уснул.

Потом он встретил стайку креветок.

— Креветки, спойте мне колыбельную!

Креветки запели тоненько-тоненько и быстро-быстро: *«Спи-спи-спи-спи!»* Бу засмеялся. Песня была весёлая, но совсем не сонная.

Потом он встретил осьминога.

— Осьминог, спой мне колыбельную!

Осьминог обнял китёнка всеми восемью лапами и запел. Было уютно, но песня была не та.

— Спасибо вам всем, — сказал Бу. — Но мне нужна не просто колыбельная. Мне нужна мамина.

И тут издалека, из глубины океана, донёсся знакомый звук. Низкий, тёплый, бесконечно родной. Это мама искала его — и пела.

Бу поплыл на этот звук. Плыл и плыл, и песня становилась всё громче и ближе. И вот из темноты показалась большая, добрая мама.

Она прижала китёнка к себе плавником.

— Я нашёл колыбельную, — прошептал Бу.

— Она всегда была с тобой, — сказала мама. — Где бы ты ни был, я тебя найду. И спою.

И мама запела. Тихо-тихо. Медленно-медленно. Песня качала китёнка, как волна.

Бу закрыл глаза… и уснул, прижавшись к маме.

И ты засыпай, моя малышка. Мама рядом. Мама всегда рядом… Спокойной ночи.`},

{ title:"Зайка, который не хотел спать", emoji:"🐰", color:"#e8457a", bg:"linear-gradient(180deg,#a8dcff,#d4f0ff 60%,#86d65c 60%)",
text:`На лесной полянке, в норке под корнями берёзы, жил зайчонок Прыг. Он очень любил прыгать — отсюда и имя. Прыг-скок, прыг-скок, весь день без остановки.

А вот спать Прыг не любил.

— Спать скучно, — говорил он маме. — Пока я сплю, все будут играть без меня!

Однажды вечером мама сказала:

— Хорошо. Сегодня можешь не спать. Иди и посмотри, кто ещё в лесу не спит.

Прыг обрадовался и выскочил из норки.

Сначала он прибежал к белке.

— Белка, давай играть!

Но белка уже свернулась в дупле, накрылась пушистым хвостом и сладко сопела.

Прыг побежал к ёжику.

— Ёжик, давай играть!

Но ёжик уже спал в куче листьев, и только иголки чуть-чуть шевелились, когда он дышал.

Прыг побежал к лисятам.

— Лисята, давайте играть!

Но лисята спали, прижавшись друг к другу, в один рыжий клубочек.

Даже ручеёк журчал тише, чем днём. Даже ветер не дул, а только чуть-чуть гладил листья.

Прыг сел на пенёк. Вокруг было тихо и темно. И совсем не с кем играть.

Тут над ним, на ветке, открыла глаза сова.

— Почему ты не спишь, малыш?

Прыг подумал… и зевнул ещё раз. Лапки стали тяжёлыми, ушки опустились.

Он поскакал домой — уже не прыг-скок, а медленно: прыг… скок… прыг…

Мама ждала его у норки. Она ничего не спросила, только укрыла мягким листиком.

— Мама, — прошептал Прыг, — завтра я буду прыгать выше всех.

— Обязательно, — сказала мама.

И Прыг уснул.

Засыпай и ты. Набирайся сил на завтра… Спокойной ночи.`},

{ title:"Светлячок Фонарик", emoji:"✨", color:"#f2a516", bg:"linear-gradient(180deg,#1b2a5c,#33508f 60%,#3f8f3a 60%)",
text:`На летнем лугу, среди высокой травы и ромашек, жили светлячки. Каждую ночь они зажигали свои огоньки и летали над лугом, как маленькие звёзды.

{ title:"Сонный поезд", emoji:"🚂", color:"#13a3a8", bg:"linear-gradient(180deg,#2a3f8f,#5a6fc9 62%,#5bbf4a 62%)",
text:`Каждый вечер, когда в окнах загораются огоньки, на маленькую станцию приезжает Сонный поезд. Его везёт добрый паровозик Чух-Чух. У него синие вагончики, а на крыше — жёлтые звёздочки.

Поезд едет в страну снов. И забирает всех, кто готов уснуть.

*— Ту-ту-у!* — тихонько гудит Чух-Чух. — Поезд отправляется!

Первая остановка — Зелёный лес. Здесь в вагончик садится маленький медвежонок. Он несёт свою подушку и зевает во весь рот.

Чух-чух, чух-чух… Поезд едет медленнее.

Третья остановка — Звёздная гора. Здесь садится котёнок. Он долго выбирает место, крутится, крутится… и наконец сворачивается клубочком у окна.

Чух-чух… чух-чух… Колёса стучат всё тише.

За окном проплывают облака, мягкие, как подушки. Пролетает Луна и машет рукой. Звёздочки заглядывают в окна и шепчут: *«Спите, спите…»*

В вагончиках тепло. Пахнет молоком и печеньем. Медвежонок уже сопит. Утята спят. Котёнок мурлычет во сне.

— Садись, — шепчет он. — Для тебя есть самое уютное место. С одеялом и с мягкой подушкой.

Ты садишься в вагончик. Укрываешься одеялом. Кладёшь голову на подушку.

И поезд трогается. Чух-чух… чух-чух… Покачивается вагончик, туда-сюда, туда-сюда…

Чух-чух… чух-чух… тише… тише…

Закрывай глазки. Поезд уже едет… Спокойной ночи.`},

{ title:"Медвежонок и одеяло из листьев", emoji:"🐻", color:"#9b51e0", bg:"linear-gradient(180deg,#ffd98a,#ffb35c 58%,#c9762f 58%)",
text:`Пришла в лес осень. Листья на деревьях стали жёлтыми, красными и оранжевыми. Подул прохладный ветер, и они полетели вниз, кружась, как бабочки.

Медвежонок Топ жил с мамой в большой берлоге под горой. Мама сказала:

— Скоро зима, Топ. Скоро мы ляжем спать до самой весны. Нам нужно тёплое одеяло.

— Я сам его сделаю! — сказал Топ. — Из листьев!

И он пошёл в лес.

Сначала Топ собрал жёлтые листья с берёзы. Они были лёгкие и шуршали: шур-шур-шур.

Потом он собрал красные листья с клёна. Они были большие, как лапы.

Потом — оранжевые с рябины. Они пахли солнцем.

Но листьев всё равно было мало. Одеяло получалось маленькое, только на одну лапку.

Топ сел на пенёк и вздохнул.

— Чего грустишь? — спросила белка.

— Хочу сделать одеяло для мамы и для себя. Но листьев мало.

— Я помогу! — сказала белка и принесла целую охапку ореховых листьев.

Потом прилетела сорока и принесла листья с дуба. Потом приполз ёжик — у него на иголках было наколото столько листьев, что он сам был похож на маленькое одеяло.

Даже ветер помог: он подул — фу-у-у! — и принёс к Топу целую гору листьев со всего леса.

Они все вместе сложили листья — жёлтые, красные, оранжевые, коричневые. Получилось большое, пушистое, разноцветное одеяло. Самое красивое на свете.

Топ принёс его маме.

— Какое чудо, — сказала мама. — Ты сам его сделал?

— Нет, — честно сказал Топ. — Мне помогали друзья.

— Тогда оно ещё теплее, — улыбнулась мама. — Одеяло, сделанное с друзьями, греет лучше всех.

Пошёл первый снег. Белые снежинки падали на гору и тихо укрывали берлогу.

А внутри было тепло. Мама и Топ лежали под разноцветным одеялом. Листья шуршали: шур-шур… шур-шур…

Топ зевнул и прижался к маме.

— Спокойной ночи до весны, мама.

— Спокойной ночи, сынок.

И они уснули. Тихо-тихо. Сладко-сладко.

Тебя тоже укрывает тёплое одеяло. И все, кто тебя любит, рядом… Спокойной ночи.`},

{ title:"Совёнок, который дружил с солнцем", emoji:"🦉", color:"#2f80ed", bg:"linear-gradient(180deg,#ffcf70,#ffe7a8 55%,#5cb85c 55%)",
text:`В дупле старого дуба жил совёнок Ух. Он был круглый, пушистый, с большими жёлтыми глазами.

Все совы спят днём, а ночью просыпаются. Так уж они устроены. Но Ух очень хотел увидеть солнце.

— Какое оно? — спрашивал он маму. — Тёплое? Большое? Доброе?

— Совы не дружат с солнцем, — говорила мама. — Мы дружим с луной.

Но однажды утром Ух не уснул. Он сидел в дупле, сонно моргал и ждал. И вот небо стало розовым… потом золотым… и из-за леса выглянуло солнце.

Оно было огромное, тёплое и такое яркое, что Ух зажмурился.

— Здравствуй, солнце! — сказал он, не открывая глаз.

— Здравствуй, малыш, — ответило солнце ласково. — А почему ты не спишь? Совы ведь спят днём.

— Я хотел с тобой подружиться, — сказал Ух. — Но я не могу смотреть на тебя. Ты слишком яркое.

Солнце засмеялось, и от этого по всему лесу побежали тёплые зайчики.

— А я никогда не видело луну, — сказало солнце. — Я всегда ухожу, когда она приходит. Расскажи мне, какая она?

И Ух рассказал. Про серебряный свет. Про звёзды, похожие на рассыпанные бусинки. Про ночной лес, где светятся светлячки и тихо поют сверчки.

— Как красиво, — сказало солнце. — А я расскажу тебе про день.

И солнце рассказало про бабочек, про цветы, которые раскрываются утром, про радугу после дождя.

Ух слушал, слушал… и глазки у него стали слипаться.

— Видишь, — сказало солнце, — мы с тобой разные. Ты видишь ночь, а я — день. Но мы можем дружить. Ты будешь рассказывать мне про луну, а я тебе — про бабочек.

— Каждый день? — сонно спросил Ух.

— Каждое утро, — пообещало солнце. — Перед тем как ты уснёшь.

Ух улыбнулся, уткнулся клювом в мягкие пёрышки и уснул. А солнце укрыло дупло тёплым лучиком, как одеялом.

С тех пор у совёнка два друга — луна и солнце. И он знает, что быть не таким, как все, — это не плохо. Это значит, что у тебя есть что-то особенное, чем можно поделиться.

Ты тоже особенная. Самая-самая… Закрывай глазки. Спокойной ночи.`},

text:`Жила-была девочка. У неё была пушистая серая кошка по имени Мурка. Каждый вечер Мурка запрыгивала к девочке на кровать, сворачивалась у неё в ногах и мурлыкала.

В конце дорожки была калитка. А за калиткой — сад.

/* Аудио: положите файлы рядом с index.html в папку audio/ — 01.mp3 … 10.mp3 */
const audioSrc = i => `audio/${String(i+1).padStart(2,'0')}.mp3`;

const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData !== undefined) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#2f8ff0'); } catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');

/* ----- build grid ----- */
$('grid').innerHTML = BOOKS.map((b,i)=>`
  <button class="card" data-i="${i}" style="animation-delay:${i*45}ms">
    <span class="num"><i style="background:${b.color}">${i+1}</i></span>
    <div class="art" style="background:${b.bg}"><span class="emoji" style="animation-delay:${i*.3}s">${b.emoji}</span></div>
    <div class="label" style="background:${b.color}"><b>${b.title}</b>${HEADPHONES}</div>
  </button>`).join('');
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openBook(+c.dataset.i)));

/* ----- reader ----- */
let current = 0;
const audio = $('audio');

function openBook(i){
  current = i; const b = BOOKS[i];
  $('rCount').textContent = `Сказка ${i+1} из ${BOOKS.length}`;
  $('rArt').style.background = b.bg; $('rArt').textContent = b.emoji;
  $('rTitle').textContent = b.title;
  $('rText').innerHTML = b.text.split(/\n\s*\n/).map(p=>`<p>${fmt(p.trim())}</p>`).join('');
  $('playBtn').style.background = b.color; $('prog').style.background = b.color;
  $('nextBtn').style.background = b.color;
  $('nextBtn').textContent = i < BOOKS.length-1 ? 'Следующая сказка →' : 'К полке сказок';
  setupAudio(i);
  show('reader');
}

function setupAudio(i){
  audio.pause(); setIcon(false); $('prog').style.width='0';
  $('pNote').textContent='Аудио скоро'; $('playBtn').disabled = true;
  audio.src = audioSrc(i); audio.load();
}
audio.addEventListener('canplay',()=>{ $('playBtn').disabled=false; $('pNote').textContent=time(audio.duration); });
audio.addEventListener('error',()=>{ $('playBtn').disabled=true; $('pNote').textContent='Аудио скоро'; });
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){ $('prog').style.width=(audio.currentTime/audio.duration*100)+'%'; $('pNote').textContent=time(audio.duration-audio.currentTime); }
});
audio.addEventListener('ended',()=>setIcon(false));
$('playBtn').addEventListener('click',()=>{ if(audio.paused){ audio.play(); setIcon(true);} else { audio.pause(); setIcon(false);} });
function setIcon(playing){ $('playIcon').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }
function time(s){ if(!isFinite(s)) return ''; s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

$('nextBtn').addEventListener('click',()=>{ current < BOOKS.length-1 ? openBook(current+1) : goHome(); });
$('backBtn').addEventListener('click',goHome);

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  window.scrollTo(0,0);
  if(tg && tg.BackButton){ try{ id==='reader' ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){} }
}
function goHome(){ audio.pause(); setIcon(false); show('home'); }
if(tg && tg.BackButton){ try{ tg.BackButton.onClick(goHome); }catch(e){} }
</script>
</body>
</html>
